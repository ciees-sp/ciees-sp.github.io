<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPST Foundational Curriculum Series | CIEES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     CPST REVIEW MODULES — VERSION REGISTRY  (single source of truth)
     Palette: Option A "Virginia Blue" (cpst-custom-code-style-guide.md)
     ---------------------------------------------------------------------
     To ADD a module:    add an object to the MODULES array in the script
                         at the bottom of this file.
     To UPDATE a module: change its `version`, `updated` date, and `note`.

     VERSIONING RULES (what the client sees):
       - Everything launches at v1.0. Pre-launch re-uploads do NOT change
         the public version — the client only ever sees v1.0 at launch.
       - MAJOR update (client requested a real content change):
           bump the whole number   1.0 -> 2.0   + set `updated` + `note`.
       - MINOR update (we caught/corrected something ourselves):
           bump the decimal         1.0 -> 1.1   + set `updated` + `note`.

     FIELDS:
       slug     folder under /projects/cpst/   (the live course)
       title    official course title (shown to client)
       added    date first posted — NEVER changes   (YYYY-MM-DD)
       version  current public version
       updated  date of the current version (= added while at v1.0)
       note     one line: what the latest version changed (client-facing)
     ===================================================================== */

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --structure:#16193E;  /* deep indigo — headers, dark panels, active   */
    --interactive:#0B6A8A;/* teal — clickable, hover borders, focus rings */
    --accent:#48AEE1;     /* light blue — secondary highlights            */
    --tint:#EDF4F7;       /* pale blue-gray — subtle emphasis surfaces    */
    --canvas:#FFFFFF;     /* white — card backgrounds                     */
    --page:#F5F5F5;       /* page background                              */
    --text:#1B1B1F;       /* near-black body                             */
    --muted:#4A4E63;      /* slate — meta/secondary (~7.5:1 on white)     */
    --hairline:#DCE0EA;   /* resting card borders                         */
    --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    --radius:14px;
    --shadow-sm:0 1px 3px rgba(22,25,62,.08);
    --shadow-md:0 10px 28px rgba(22,25,62,.16);
    --t:200ms ease;
  }

  body{
    background:var(--page,#F5F5F5);
    color:var(--text,#1B1B1F);
    font-family:var(--font);
    font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* ── Hero ── */
  .hero{background:var(--structure,#16193E);color:#fff;padding:48px 32px 44px;}
  .hero-inner{max-width:920px;margin:0 auto;}
  .hero img{width:clamp(200px,42vw,270px);height:auto;display:block;margin-bottom:30px;}
  .overline{
    font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--accent,#48AEE1);margin-bottom:14px;
  }
  .hero h1{
    font-weight:800;font-size:clamp(30px,5vw,46px);
    line-height:1.08;letter-spacing:-.5px;color:#fff;
  }
  .rule{display:block;width:54px;height:3px;background:var(--accent,#48AEE1);margin:22px 0;}
  .hero p{color:rgba(255,255,255,.78);max-width:52ch;font-size:16px;}
  .stat{
    font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    color:rgba(255,255,255,.6);margin-top:24px;
  }

  /* ── Main ── */
  main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:40px 32px 8px;}
  .legend{font-size:13px;color:var(--muted);margin-bottom:22px;}

  .modules{display:flex;flex-direction:column;gap:20px;}

  .module-block{
    display:flex;flex-direction:column;
    background:var(--canvas,#fff);
    border:1px solid var(--hairline,#DCE0EA);
    border-left:4px solid transparent;
    border-radius:var(--radius);box-shadow:var(--shadow-sm);
    overflow:hidden;
    transition:transform var(--t),box-shadow var(--t),border-color var(--t);
  }
  .module-block:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-left-color:var(--interactive,#0B6A8A);}
  .module{
    display:flex;align-items:center;gap:18px;
    padding:20px 24px;text-decoration:none;color:inherit;
  }
  .module:focus-visible{outline:3px solid var(--interactive,#0B6A8A);outline-offset:-3px;}

  .info{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .title{font-weight:700;font-size:20px;letter-spacing:-.2px;line-height:1.25;color:var(--structure,#16193E);}
  .meta{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
  .ver{display:inline-block;background:var(--tint,#EDF4F7);color:var(--structure,#16193E);padding:2px 9px;border-radius:20px;text-transform:none;vertical-align:middle;}
  .ver.up{background:var(--accent,#48AEE1);color:#fff;}
  .note{font-size:13px;font-weight:600;color:var(--interactive,#0B6A8A);}
  .arrow{margin-left:auto;color:var(--interactive,#0B6A8A);font-size:22px;flex-shrink:0;padding-left:8px;transition:transform var(--t);}
  .module-block:hover .arrow{transform:translateX(3px);}

  /* change log — inside the same card, split by a hairline */
  .relnotes{border-top:1px solid var(--hairline,#DCE0EA);padding:16px 24px 20px;}
  .relnotes-label{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--interactive,#0B6A8A);margin-bottom:8px;}
  .relnotes .cl{font-size:14px;color:var(--text,#1B1B1F);line-height:1.55;margin:0;}
  .relnotes .deferred{font-size:13px;color:var(--muted);margin-top:12px;}
  .relnotes .reviewlink{margin-top:10px;}
  .relnotes .reviewlink a{color:var(--interactive,#0B6A8A);font-weight:700;text-decoration:none;font-size:13px;}
  .relnotes .reviewlink a:hover{text-decoration:underline;}

  /* ── Footer ── */
  footer{
    text-align:center;padding:36px 32px;margin-top:36px;
    font-size:13px;color:var(--muted);border-top:1px solid var(--hairline,#DCE0EA);
  }

  noscript{display:block;max-width:920px;margin:24px auto;padding:0 32px;color:var(--structure);}

  @media (max-width:600px){
    .hero{padding:34px 20px;}
    main{padding:28px 20px 8px;}
    .module{padding:16px 18px;gap:14px;}
    .title{font-size:17px;}
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <img src="../../assets/logo-horizontal-white.png" alt="CIEES — Old Dominion University">
      <h1>Modules in review</h1>
      <span class="rule"></span>
      <p>Current builds of the CPST Foundational Curriculum series</p>
    </div>
  </header>

  <main>
    <div class="modules" id="modules"></div>
    <noscript>This index needs JavaScript to display the module list. Each review module is available directly at <strong>/projects/cpst/&lt;module&gt;-review/</strong>.</noscript>
  </main>

  <footer id="foot"></footer>

  <script>
    /* ---- VERSION REGISTRY — edit here (see rules in the CSS comment above) ---- */
    const MODULES = [
      { slug:'ethics-review',          title:'Foundational Professional Ethics for Community-Based Behavioral Health Services',           added:'2026-05-04', version:'2.0', updated:'2026-07-30',
        changelog:'All review feedback addressed (3 comments), core ethical principles activity content refined, terminology aligned with Virginia guidance (2 corrections), unified title and Module Wrap-Up in place, reflection responses now record and are downloadable.',
        nextUpdate:'question logic and gates on, alt text for images',
        reviewUrl:'https://360.articulate.com/review/content/041c15cc-ec5e-4b27-b98c-3f29c46ed8ca/review' },
      { slug:'listening-review',       title:'Foundational Listening Skills for Community-Based Behavioral Health Services',               added:'2026-05-29', version:'2.0', updated:'2026-07-30',
        changelog:'All review feedback addressed (3 comments), therapeutic-relationship definitions refined, terminology aligned with Virginia guidance, unified title and Module Wrap-Up in place, reflection responses now record to your LMS.',
        nextUpdate:'question logic and gates on, alt text for images, video embed',
        reviewUrl:'https://360.articulate.com/review/content/3f75f77f-d581-4c73-8b87-a0c4599e6ca3/review' },
      { slug:'rehab-review',           title:'Foundational Rehabilitation Skills for Community-Based Behavioral Health Practice',          added:'2026-06-04', version:'1.0', updated:'2026-06-04', note:'Revisions in progress.' },
      { slug:'cpst-basics-review',     title:'Foundational Community Psychiatric Support and Treatment (CPST): Service Basics',            added:'2026-06-05', version:'1.0', updated:'2026-06-05', note:'Revisions in progress.' },
      { slug:'motivation-review',      title:'Enhancing Motivation in Community-Based Behavioral Health Practice',                         added:'2026-06-10', version:'1.0', updated:'2026-06-10', note:'Revisions in progress.' },
      { slug:'recovery-review',        title:'Foundations of Recovery-Oriented Practice for Community-Based Behavioral Health',            added:'2026-06-15', version:'1.0', updated:'2026-06-15', note:'Revisions in progress.' },
      { slug:'person-centered-review', title:'Foundational Person-Centered Planning for Community-Based Behavioral Health Services',       added:'2026-06-22', version:'1.0', updated:'2026-06-22', note:'Revisions in progress.' },
      { slug:'smi-review',             title:'Foundational Serious Mental Illness Skills for Community-Based Behavioral Health Services',   added:'2026-06-23', version:'1.0', updated:'2026-06-23', note:'Revisions in progress.' },
      { slug:'sed-review',             title:'Foundational Serious Emotional Disturbance Skills for Community-Based Behavioral Health Services', added:'2026-06-29', version:'1.0', updated:'2026-06-29', note:'Revisions in progress.' },
      { slug:'measurement-review',     title:'Foundational Measurement and Monitoring Skills for Community-Based Behavioral Health Services', added:'2026-06-30', version:'1.0', updated:'2026-06-30', note:'Revisions in progress.' },
      { slug:'crisis-review',      title:'Foundational Crisis Management Skills for Community-Based Behavioral Health Services', added:'2026-06-30', version:'1.0', updated:'2026-06-30', note:'Revisions in progress.' },
      /* Add new modules here as objects, same shape. */
    ];

    const MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    function fmt(d){ const p=d.split('-').map(Number); return MO[p[1]-1]+' '+p[2]+', '+p[0]; }

    const sorted = MODULES.slice().sort(function(a,b){ return a.added.localeCompare(b.added); });
    const list = document.getElementById('modules');

    sorted.forEach(function(mod,i){
      const isUpdated = mod.updated && mod.updated !== mod.added;
      const when = isUpdated ? ('Updated '+fmt(mod.updated)) : ('Posted '+fmt(mod.added));
      const block = document.createElement('div');
      block.className = 'module-block';
      const a = document.createElement('a');
      a.className = 'module';
      a.href = './'+mod.slug+'/';
      a.setAttribute('aria-label', mod.title+' — version '+mod.version+', '+when);
      var noteHtml = mod.note ? ('<span class="note">'+mod.note+'</span>') : '';
      a.innerHTML =
        '<span class="info">'+
          '<span class="title">'+mod.title+'</span>'+
          '<span class="meta"><span class="ver'+(isUpdated?' up':'')+'">v'+mod.version+'</span> &middot; '+when.toUpperCase()+'</span>'+
          noteHtml+
        '</span>'+
        '<span class="arrow" aria-hidden="true">&rarr;</span>';
      block.appendChild(a);
      if (mod.changelog){
        const rn = document.createElement('div');
        rn.className = 'relnotes';
        var nextHtml = mod.nextUpdate ? ('<p class="deferred"><strong>Next update:</strong> '+mod.nextUpdate+'</p>') : '';
        var reviewHtml = mod.reviewUrl ? ('<p class="reviewlink"><a href="'+mod.reviewUrl+'" target="_blank" rel="noopener">Open in Review 360 to leave comments &rarr;</a></p>') : '';
        rn.innerHTML = '<div class="relnotes-label">Change Log</div><p class="cl">'+mod.changelog+'</p>'+nextHtml+reviewHtml;
        block.appendChild(rn);
      }
      list.appendChild(block);
    });

    const lastUpdated = sorted.map(function(m){return m.updated||m.added;}).sort().slice(-1)[0];
    document.getElementById('foot').textContent =
      'Last updated '+fmt(lastUpdated)+' · CIEES · Old Dominion University';
  </script>
</body>
</html>
