    if (s.id === 'lab-exit') return { set: 'practice', now: 0, all: true };
    var p = PRACTICE_IDS.indexOf(s.id);
    if (p !== -1) return { set: 'practice', now: p + 1, all: false };
    var n = taskNumberOf(s);
    if (n === 0 || n === -1) return { set: 'practice', now: 0, all: false };
    if (n === 6) return { set: 'tasks', now: 0, all: true };
    return { set: 'tasks', now: n, all: false };
  }
  function updateProgress(s) {
    var p = progressOf(s);
    var practice = p.set === 'practice';
    var names = practice ? STEPS.practice : STEPS.tasks;
    STEPS_LIST.innerHTML = '';
    names.forEach(function (name, i) {
      var n = i + 1;
      var st = p.all ? 'done'
        : p.now === 0 ? 'todo'
        : n < p.now ? 'done'
        : n === p.now ? 'now' : 'todo';
      var li = document.createElement('li');
      li.setAttribute('data-state', st);
      if (st === 'now') li.setAttribute('aria-current', 'step');
      /* Change spec v14 §A: a practice item carries its number inside its own
         name ("Practice 1"), so it gets no `.step-n` — the number would
         otherwise be shown and spoken twice.  Task items are unchanged. */
      if (!practice) {
        var num = txt('span', 'step-n', String(n));
        num.setAttribute('aria-hidden', 'true');
        li.appendChild(num);
      }
      /* At most one state word per item, so a screen reader user hears the
         number a sighted user sees and what state the step is in.  On a todo
         practice item the "Step {n}: " prefix would read "Step 1: Practice 1",
         so v14 §A drops it: the item reads just its name. */
      var prefix = st === 'done' ? 'Completed: '
        : st === 'now' ? 'Current: '
        : practice ? null : 'Step ' + n + ': ';
      if (prefix) li.appendChild(txt('span', 'sr-only', prefix));
      li.appendChild(txt('span', 'step-name', name));
      STEPS_LIST.appendChild(li);
    });
  }

  /* ------------------------------------------------------- shared fragments */
  function eyebrow(parent, text) { parent.appendChild(txt('p', 'eyebrow', text)); }
  function heading(parent, text) {
    var h = txt('h1', null, text);
    h.setAttribute('tabindex', '-1');
    parent.appendChild(h);
    return h;
  }
  function lede(parent, paras, cls) {
    var d = el('div', 'lede col' + (cls ? ' ' + cls : ''));
    paras.forEach(function (p, i) {
      /* Change spec v12 §A: a body entry may be a real list instead of a
         paragraph — the POUR list on orientation 1 is the only one.  Every
         other screen passes plain strings and renders exactly as before. */
      if (p && p.list) { d.appendChild(bulletList(p.list)); return; }
      d.appendChild(el('p', i === 0 ? 'first' : null, p));
    });
    parent.appendChild(d);
    return d;
  }
  /* A <ul> whose every item opens with its term in bold, then the sentence. */
  function bulletList(rows) {
    var ul = el('ul', 'pourlist');
    rows.forEach(function (row) {
      var li = document.createElement('li');
      li.appendChild(txt('b', null, row.term));
      li.appendChild(document.createTextNode(' ' + row.text));
      ul.appendChild(li);
    });
    return ul;
  }
  /* Change spec v12 §A: the references block at the foot of orientation 1.
     A small h2, then one APA entry per source with the title in italics and
     the URL as a real link that opens in a new tab and says so to a screen
     reader.  No new request: the links are never followed by the activity. */
  function referencesBlock(heading2, refs) {
    var box = el('div', 'refs');
    box.appendChild(txt('h2', 'refs-h', heading2));
    refs.forEach(function (r) {
      var p = el('p', 'ref');
      p.appendChild(document.createTextNode(r.author + ' ' + r.date + ' '));
      p.appendChild(txt('i', null, r.title));
      p.appendChild(document.createTextNode(r.after + ' '));
      var a = document.createElement('a');
      a.className = 'reflink';
      a.href = r.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.appendChild(document.createTextNode(r.url));
      a.appendChild(txt('span', 'sr-only', ' (opens in a new tab)'));
      p.appendChild(a);
      box.appendChild(p);
    });
    return box;
  }
  /* The goal line on a repaired screen carries the access condition; the
     labelled controls block is the only place a key or a control is named,
     and it renders only where change spec v10 §E allows one.  Change spec
     v17 §B removes the task screen's tool line outright (it had already been
     removed from the practice screens in v13), so goalLine is the only one of
     the pair left. */
  function goalLine(html) { return el('p', 'instruction', html); }
  function controlsBlock(def) {
    var box = el('div', 'controls');
    box.appendChild(txt('h2', 'controls-label', def.label));
    var dl = document.createElement('dl');
    def.rows.forEach(function (row) {
      var line = el('div', 'crow');
      var dt = document.createElement('dt');
      dt.appendChild(txt(row[2] === 'k' ? 'kbd' : 'b', null, row[0]));
      line.appendChild(dt);
      line.appendChild(txt('dd', null, row[1]));
      dl.appendChild(line);
    });
    box.appendChild(dl);
    return box;
  }
  function primary(parent, label, onClick) {
    var wrap = el('div', 'actions');
    var b = txt('button', 'btn', label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    wrap.appendChild(b);
    parent.appendChild(wrap);
    return b;
  }

  /* ======================================================== SCREEN: cover ==
     Change spec v15 §A.  One centred column — eyebrow, two-line title with the
     blinking caret, the rule that draws itself, the subtitle and Start — and
     nothing else on the screen.  The markup is the static, finished state; the
     `is-animated` class added below is the only thing that puts any of it in
     motion, so a learner with JS off or with reduced motion asked for sees the
     whole cover at once, with no caret.
     The two h1 lines are joined by a <br> AND a single space: the space is
     collapsed away at the start of the second line, and it is what keeps the
     heading's accessible name (and the tab title) "Access in Action" rather
     than "Accessin Action". */
  RENDER.cover = function (node, s) {
    var c = s.cover;
    node.classList.add('cover');
    node.setAttribute('data-screen', 'cover');
    node.appendChild(txt('p', 'cover-eyebrow', c.eyebrow));

    var h = el('h1', 'cover-h1');
    h.setAttribute('tabindex', '-1');
    c.h1.forEach(function (line, i) {
      if (i) {
        h.appendChild(document.createElement('br'));
        h.appendChild(document.createTextNode(' '));
      }
      h.appendChild(document.createTextNode(line));
    });
    var bar = el('span', 'cover-bar');
    bar.setAttribute('aria-hidden', 'true');
    h.appendChild(bar);
    node.appendChild(h);

    var rule = el('div', 'cover-rule');
    rule.setAttribute('aria-hidden', 'true');
    node.appendChild(rule);

    node.appendChild(txt('p', 'cover-sub', c.sub));

    var actions = el('div', 'actions');
    var b = txt('button', 'btn cover-start', c.button);
    b.type = 'button';
    b.addEventListener('click', function () { go('s0a'); });
    actions.appendChild(b);
    node.appendChild(actions);

    /* The sequence is under four seconds and Start is in the DOM from the
       first frame, so there is nothing to skip and nothing to wait for. */
    if (!reduced()) node.classList.add('is-animated');
  };

  /* ================================================== SCREEN: orientation == */
  RENDER.orientation = function (node, s) {
    var o = s.orient;
    /* Change spec v12 §A: orientation 1 has no eyebrow.  It leads with the
       heading and a subtitle, so its body paragraphs are all set the same and
       the subtitle alone carries the lead. */
    if (o.eyebrow) eyebrow(node, o.eyebrow);
    heading(node, o.h1);
    if (o.subtitle) node.appendChild(txt('p', 'subtitle', o.subtitle));
    lede(node, o.paras, o.subtitle ? 'flat' : null);
    if (o.callout) node.appendChild(txt('div', 'callout', o.callout));
    if (o.meta) node.appendChild(txt('p', 'meta', o.meta));
    if (o.refs) node.appendChild(referencesBlock(o.refsHeading, o.refs));
    primary(node, o.button, function () { go(nextId(s.id)); });
  };

  /* ======================================================= SCREEN: bridge ==
     The Practice Lab intro and exit and the five task transitions all share
     one shape — an eyebrow, an h1, the body lines, one Continue. */
  RENDER.bridge = function (node, s) {
    eyebrow(node, s.bridge.eyebrow);
    heading(node, s.bridge.h1);
    lede(node, s.bridge.lines);
    primary(node, 'Continue', function () { go(nextId(s.id)); });
  };

  /* ===================================================== SCREEN: practice ==
     Change spec v13 §D: eyebrow "Practice Lab", heading, body paragraphs, the
     controls block where §E allows one, the artifact, then the completion line
     and Continue.  There is no tool line here any more — the task screens keep
     theirs.  Continue is not in the DOM until the required interaction is done,
     and no amount of waiting puts it there. */
  RENDER.practice = function (node, s) {
    var p = s.practice;
    eyebrow(node, 'Practice Lab');
    heading(node, p.h1);

    var bodyWrap = el('div', 'bodylines');
    p.body.forEach(function (line) { bodyWrap.appendChild(goalLine(line)); });
    node.appendChild(bodyWrap);

    if (p.controls) node.appendChild(controlsBlock(CONTROLS[p.controls]));

    var art = el('div', 'artifact');
    node.appendChild(art);

    var done = el('div', 'donenote');
    done.setAttribute('role', 'status');
    node.appendChild(done);

    var actions = el('div', 'actions');
    node.appendChild(actions);

    var finished = false;
    function complete() {
      if (finished) return;
      finished = true;
      /* Change spec v13 §E: a statement, not an alert — the circled check is
         written in at completion time, never sitting in an empty line. */
      var mark = txt('span', 'donecheck', '✓');
      mark.setAttribute('aria-hidden', 'true');
      done.appendChild(mark);
      done.appendChild(txt('span', 'donetext', p.done));
      var cont = txt('button', 'btn', 'Continue');
      cont.type = 'button';
      cont.addEventListener('click', function () { go(nextId(s.id)); });
      actions.appendChild(cont);
      later(function () { cont.focus(); }, 120);
    }

    if (p.kind === 'sr') {
      var pressed = {};
      activeSim = SRSimulator.create(art, {
        docs: [SR_DOCS.practice], showNotes: false,
        onEvent: function (name, d) {
          if (name !== 'key') return;
          if (d.key === 'h' || d.key === 'l') pressed[d.key] = true;
          if (pressed.h && pressed.l) complete();
        }
      });
      /* Change spec v10 §D: the screen stays ON for the whole practice, so the
         learner connects what they see with what they hear.  The engine's own
         viewer toggle is used to turn the screen on and is then removed from
         the frame; reset() clears the line the toggle wrote, so the console
         opens on its usual first line.  No engine code changed. */
      var pk = art.querySelector('[data-role="peek"]');
      if (pk) { pk.click(); if (pk.parentNode) pk.parentNode.removeChild(pk); }
      activeSim.reset();
      unmarkSimLandmark(art);
    } else if (p.kind === 'kb') {
      art.appendChild(buildLibraryPractice(complete));
      art.classList.add('no-pointer');
    } else {
      art.appendChild(buildWord({
        doc: PRACTICE_DOC, fixed: true, file: PRACTICE_DOC.file,
        onPane: function (id) { if (id === 'pd-travel') complete(); }
      }));
      initialFocus = function () {
        var cb = art.querySelector('.w-navcb');
        if (cb) cb.focus({ preventScroll: true });
      };
    }
  };

  /* ==================================================== SCREEN: encounter ==
     Change spec v10 §F, as amended by change spec v17 §B/§C.  Task screen:
     eyebrow, task title, story paragraph, controls block where §E allows one,
     artifact, question, buttons — no tool line any more.  Repaired screen:
     the "Try the repair" eyebrow, in-world heading, the repair lines, the
     goal line, then the same pieces. */
  RENDER.encounter = function (node, s) {
    var t = s.task, fixed = !!s.fixed;
    /* E is a stable reference for every callback below; the module-level `enc`
       is nulled by teardown() the moment we navigate away. */
    var E = {
      task: t, fixed: fixed, ended: false, locked: false,
      artKeys: 0, clipEnded: false, lockMs: null,
      t0: null, maxPage: 1, lastPane: null, screenId: s.id
    };
    enc = E;

    eyebrow(node, fixed ? 'Try the repair' : ('Task ' + t.n + ' of 5'));
    heading(node, fixed ? t.repairH1 : t.title);
    if (fixed) {
      lede(node, t.repairLines);
      node.appendChild(goalLine(t.goalFixed));
    } else {
      lede(node, [t.para]);
    }
    if (t.controls) node.appendChild(controlsBlock(CONTROLS[t.controls]));

    var art = el('div', 'artifact');
    node.appendChild(art);
    E.art = art;

    var q = fixed && t.questionFixed ? t.questionFixed : t.question;
    var qNode = null;
    if (q) {
      /* The first Continue locks the answer on this screen; the same Continue
         then advances.  The clock stops at the lock. */
      qNode = buildQuestion(q, {
        onLock: function () {
          E.locked = true;
          E.lockMs = E.t0 == null ? null : (window.performance.now() - E.t0);
          clearTimers();
        },
        onAdvance: function (i) { finish(i === q.unknownIndex ? 'unknown' : 'answered', i); }
      }, E);
      node.appendChild(qNode.wrap);
    }

    /* Change spec v13 §C: where the fail-safe used to be there is now an empty
       slot.  Only Task 2 ever fills it, and only once Registration has opened;
       every other encounter leaves it empty, and an empty slot takes no room in
       the layout.  Change spec v16 §C: what Task 2 puts here is its completion
       line in the feedback pattern, then the Continue button. */
    var post = el('div', 'post');
    node.appendChild(post);
    E.postWrap = post;

    /* ---- ending the encounter ---- */
    function finish(kind, chosenIndex) {
      if (E.ended) return;
      E.ended = true;
      clearTimers();
      var slot = fixed ? 1 : 0;
      var ms = E.lockMs != null ? E.lockMs
        : (E.t0 == null ? null : (window.performance.now() - E.t0));
      if (t.key === 't3') {
        state.times.t3[slot] = ms;
        state.t3method[slot] = { pages: E.maxPage, pane: paneReachedTarget(t, fixed, E) };
      }
      if (t.key === 't2') state.t2[slot] = { keys: E.artKeys, ms: ms };
      /* Change spec v14 §C: the stored answer keeps its text and gains the
         verdict.  The closing reads the text alone. */
      state.answers[t.key][slot] = (q && chosenIndex != null)
        ? { text: q.options[chosenIndex], correct: chosenIndex === q.correct }
        : null;
      save();
      go(nextId(s.id));
    }
    E.finish = finish;

    /* ---- the artifact ---- */
    E.t0 = window.performance.now();
    if (t.artifact === 'sr') {
      /* The email frame is taller than the practice notice, and it keeps that
         one height in both the sighted and the dark state. */
      art.classList.add('doc-email');
      activeSim = SRSimulator.create(art, {
        docs: [fixed ? SR_DOCS.t1fixed : SR_DOCS.t1broken], showNotes: false,
        onEvent: function (name) { if (name === 'key') E.artKeys++; }
      });
      unmarkSimLandmark(art);
    } else if (t.artifact === 'site') {
      art.appendChild(buildSite(fixed, E, finish, {}));
      /* The mouse is unavailable for this task, in both versions: the two
         encounters are only comparable if they are counted the same way. */
      art.classList.add('no-pointer');
      art.appendChild(txt('p', 'sr-only', 'Pointer input is unavailable for this task.'));
      /* Every key press made while focus is inside the artifact is counted,
         silently. */
      art.addEventListener('keydown', function () { E.artKeys++; });
      initialFocus = function () {
        var u = art.querySelector('.urlbar');
        if (u) u.focus({ preventScroll: true });
      };
    } else if (t.artifact === 'word') {
      art.appendChild(buildWord({
        doc: PROGRAM, fixed: fixed, file: PROGRAM.file,
        /* Only the MOST RECENT pane selection counts, and only when it is the
           target session or the block that holds it. */
        onPane: function (id) { E.lastPane = id; },
        onReach: function (n) { if (n > E.maxPage) E.maxPage = n; }
      }));
      initialFocus = function () {
        var cb = art.querySelector('.w-navcb');
        if (cb) cb.focus({ preventScroll: true });
      };
    } else if (t.artifact === 'form') {
      art.appendChild(buildForm(fixed, false));
    } else if (t.artifact === 'video') {
      art.appendChild(buildVideo(fixed, E, false));
    }
  };

  /* The "using the Navigation Pane" variant describes what actually happened,
     so it fires only when the learner's most recent pane selection was the
     target session or the block that contains it.  The first version's pane
     lists neither, so on that version it can never fire.  Change spec v16 §B:
     the same rule chooses between `feedback` and `feedbackPane` at lock time,
     which is why the feedback line and the crosswalk never disagree. */
  function paneReachedTarget(t, fixed, e) {
    if (!t.paneTargets || !e.lastPane) return false;
    return t.paneTargets[fixed ? 1 : 0].indexOf(e.lastPane) !== -1;
  }

  /* Change spec v16 §B: the feedback sentence carries the answer, what
     happened, and — where this task has one — the measurement.  The
     placeholders are filled at lock time from the encounter's own counters:
     `{keys}` from the key presses made inside the artifact, `{time}` from the
     clock the encounter started, `{pages}` from the furthest page reached.
     Tasks 1, 4 and 5 have nothing to measure, so their sentences hold no
     placeholder and this function returns them unchanged. */
  function fillMeasures(s, e) {
    return String(s)
      .replace('{keys}', fmtKeys(e ? e.artKeys : 0))
      .replace('{time}', fmtDuration(e ? e.lockMs : null))
      .replace('{pages}', fmtPages(e ? e.maxPage : 1));
  }
  function feedbackSentence(q, e) {
    var s = (q.feedbackPane && e && paneReachedTarget(e.task, e.fixed, e))
      ? q.feedbackPane : q.feedback;
    return fillMeasures(s, e);
  }
  function endStop(s) { return /[.!?]$/.test(s) ? s : s + '.'; }
  function fmtKeys(n) { return n + ' key press' + (n === 1 ? '' : 'es'); }
  function fmtPages(n) { return n + ' page' + (n === 1 ? '' : 's'); }
  function fmtDuration(ms) {
    var s = Math.max(1, Math.round((ms || 0) / 1000));
    if (s < 60) return s + ' second' + (s === 1 ? '' : 's');
    var m = Math.floor(s / 60), r = s % 60;
    var out = m + ' minute' + (m === 1 ? '' : 's');
    if (r) out += ' ' + r + ' second' + (r === 1 ? '' : 's');
    return out;
  }

  /* ---- the information question ----
     Selecting an option enables Continue.  The first Continue does not leave
     the screen: the choice locks, the other options dim, and a status line
     says whether the answer was right and gives the fact behind it (change
     spec v14 §C).  Change spec v16 §B: that same line now also carries what
     happened and, where the task has one, the measurement — so there is no
     separate screen for it.  The same Continue then advances.  The chosen
     option carries the matching glyph; a wrong answer never highlights the
     right option, because the feedback sentence carries the fact. */
  var qSeq = 0;
  function buildQuestion(q, cb, ctx) {
    var id = 'q' + (++qSeq);
    var wrap = el('div', 'qblock');
    var fs = document.createElement('fieldset');
    var lg = txt('legend', null, q.legend);
    fs.appendChild(lg);
    var opts = el('div', 'opts');
    var out = { wrap: wrap };
    var labels = [], inputs = [];
    q.options.forEach(function (label, i) {
      var lab = el('label');
      var input = document.createElement('input');
      input.type = 'radio'; input.name = id; input.value = String(i); input.id = id + '-o' + i;
      lab.appendChild(input);
      lab.appendChild(txt('span', 'otext', label));
      input.addEventListener('change', function () {
        labels.forEach(function (l) { l.classList.remove('is-checked'); });
        lab.classList.add('is-checked');
        btn.disabled = false;
      });
      labels.push(lab); inputs.push(input);
      opts.appendChild(lab);
    });
    fs.appendChild(opts);
    wrap.appendChild(fs);

    var status = el('div', 'qstatus');
    status.setAttribute('role', 'status');
    wrap.appendChild(status);

    var actions = el('div', 'actions');
    var btn = txt('button', 'btn', 'Continue');
    btn.type = 'button';
    btn.disabled = true;
    var locked = false, chosen = null;
    btn.addEventListener('click', function () {
      if (!locked) {
        var sel = opts.querySelector('input:checked');
        if (!sel) return;
        chosen = parseInt(sel.value, 10);
        locked = true;
        var right = chosen === q.correct;
        /* The clock stops first: the sentence below is written from the
           counters this call freezes (change spec v16 §B). */
        if (cb && cb.onLock) cb.onLock(chosen, right);
        inputs.forEach(function (inp, i) {
          inp.disabled = true;
          if (i !== chosen) labels[i].classList.add('is-dim');
        });
        labels[chosen].classList.add('is-locked');
        labels[chosen].classList.add(right ? 'is-correct' : 'is-wrong');
        var tick = txt('span', 'otick', right ? '✓' : '✕');
        tick.setAttribute('aria-hidden', 'true');
        labels[chosen].appendChild(tick);
        /* The same visual pattern as the practice completion line: a 20 px
           circle, then the sentence.  The glyph is decorative — the verdict is
           carried by the words "Correct." / "Not quite.", so a screen reader
           hears it. */
        var mark = txt('span', 'qmark ' + (right ? 'is-correct' : 'is-wrong'), right ? '✓' : '✕');
        mark.setAttribute('aria-hidden', 'true');
        status.appendChild(mark);
        status.appendChild(txt('span', 'qstatustext',
          (right ? 'Correct. ' : 'Not quite. ') + feedbackSentence(q, ctx)));
        return;
      }
      if (cb && cb.onAdvance) cb.onAdvance(chosen);
    });
    actions.appendChild(btn);
    wrap.appendChild(actions);
    return out;
  }

  /* ======================================================= SCREEN: rating ==
     Selecting a face records it at once and enables Continue.  Continue
     advances.  There is no auto-advance and no timer anywhere in this
     component; the selection can be changed until Continue is pressed. */
  var RATING_PROMPT = 'How successful did you feel at that task?';
  RENDER.rating = function (node, s) {
    var t = s.task;
    eyebrow(node, 'Task ' + t.n + ' of 5');
    heading(node, RATING_PROMPT);
    var fs = document.createElement('fieldset');
    fs.className = 'rating';
    var lg = txt('legend', 'sr-only', RATING_PROMPT);
    fs.appendChild(lg);
    var faces = el('div', 'faces');
    var name = 'rate-' + t.key + '-' + s.round;

    FACES.forEach(function (f) {
      var lab = el('label', 'face');
      var input = document.createElement('input');
      input.type = 'radio'; input.name = name; input.value = f.v; input.id = name + '-' + f.v;
      var em = txt('span', 'emoji', f.emoji);
      em.setAttribute('aria-hidden', 'true');
      lab.appendChild(input);
      lab.appendChild(em);
      lab.appendChild(txt('span', 'ftext', f.label));
      input.addEventListener('change', function () {
        faces.querySelectorAll('label').forEach(function (l) { l.classList.remove('is-checked'); });
        lab.classList.add('is-checked');
        state.ratings[t.key][s.round] = f.v;
        save();
        announce('Recorded: ' + f.label);
        cont.disabled = false;
      });
      faces.appendChild(lab);
    });
    fs.appendChild(faces);
    node.appendChild(fs);

    var actions = el('div', 'actions');
    var cont = txt('button', 'btn', 'Continue');
    cont.type = 'button';
    cont.disabled = true;
    cont.addEventListener('click', function () { go(nextId(s.id)); });
    actions.appendChild(cont);
    node.appendChild(actions);
  };
  function faceByValue(v) {
    for (var i = 0; i < FACES.length; i++) if (FACES[i].v === v) return FACES[i];
    return null;
  }

  /* Change spec v16 §A: there is no try-again screen.  The first rating leads
     straight to the repaired encounter, and the measurement that screen used to
     carry now rides in the feedback line on the task screen itself. */

  /* ============================================ SCREEN: crosswalk 1 of 2 ==
     Change spec v10 §G.  "What changed": the learner's own reaction to the
     first version beside a frozen view of the broken artifact, a divider, then
     the same for the repaired version, with the repaired artifact drawn frozen
     and annotated with numbered pins and a notes column. */
  RENDER.crossA = function (node, s) {
    var t = s.task;
    eyebrow(node, 'What changed');
    heading(node, t.title);
    node.appendChild(changeBlock(t, false));
    node.appendChild(el('div', 'xdiv'));
    node.appendChild(changeBlock(t, true));
    primary(node, 'Continue', function () { go(nextId(s.id)); });
  };

  function changeBlock(t, after) {
    var box = el('div', 'xblock ' + (after ? 'is-after' : 'is-before'));
    var head = el('p', 'xhead');
    head.appendChild(txt('span', 'xtag', after ? 'After' : 'Before'));
    head.appendChild(document.createTextNode(' '));
    head.appendChild(reactionLine(t, after ? 1 : 0));
    box.appendChild(head);
    box.appendChild(txt('p', 'xpara', after ? t.crosswalk.changed : t.crosswalk.before));
    if (after) box.appendChild(pinnedArtifact(t));
    else {
      var wrap = el('div', 'pinwrap');
      wrap.appendChild(frozenArtifact(t, false));
      box.appendChild(wrap);
    }
    return box;
  }

  /* "Your rating for the first version: 😐 Partly successful." — with the
     measurement this task recorded appended before the full stop, exactly as
     the copy's template gives it. */
  function reactionLine(t, slot) {
    var span = el('span', 'xreact');
    span.appendChild(document.createTextNode(
      slot ? 'Your rating for the repaired version: ' : 'Your rating for the first version: '));
    var f = faceByValue(state.ratings[t.key][slot]);
    if (f) {
      var e = txt('span', 'emoji', f.emoji);
      e.setAttribute('aria-hidden', 'true');
      span.appendChild(e);
      span.appendChild(document.createTextNode(' ' + f.label));
    } else {
      span.appendChild(document.createTextNode('Not rated'));
    }
    var tail = measureTail(t, slot);
    if (tail) span.appendChild(document.createTextNode(tail));
    span.appendChild(document.createTextNode('.'));
    return span;
  }
  function measureTail(t, slot) {
    if (t.key === 't2') {
      var d = state.t2[slot];
      return d ? ' · ' + fmtKeys(d.keys) + ' · ' + fmtDuration(d.ms) : '';
    }
    if (t.key === 't3') {
      var ms = state.times.t3[slot];
      if (ms == null) return '';
      if (slot === 1) return ' · ' + fmtDuration(ms);
      var m = state.t3method[0];
      return ' · ' + fmtPages(m ? m.pages : 1) + ' · ' + fmtDuration(ms);
    }
    return '';
  }

  /* The repaired artifact, frozen, with one numbered circle anchored on each
     element the copy's pin notes name, and the notes themselves in their own
     column beside it (stacked under it on a narrow screen).  Each pin is
     aria-hidden; the ordered list carries the text, numbered to match. */
  function pinnedArtifact(t) {
    var grid = el('div', 'pinned');
    var wrap = el('div', 'pinwrap');
    var frozen = frozenArtifact(t, true);
    wrap.appendChild(frozen);
    var pins = [];
    t.crosswalk.pins.forEach(function (p, i) {
      var pin = txt('span', 'pin', String(i + 1));
      pin.setAttribute('aria-hidden', 'true');
      wrap.appendChild(pin);
      pins.push({ node: pin, sel: p.sel });
    });
    grid.appendChild(wrap);

    var col = el('div', 'pinnotes');
    var ol = document.createElement('ol');
    t.crosswalk.pins.forEach(function (p, i) {
      var li = document.createElement('li');
      var num = txt('span', 'pinnum', String(i + 1));
      num.setAttribute('aria-hidden', 'true');
      li.appendChild(num);
      li.appendChild(txt('span', 'pinnote', p.note));
      ol.appendChild(li);
    });
    col.appendChild(ol);
    grid.appendChild(col);

    placePins(wrap, frozen, pins);
    return grid;
  }

  /* Pin positions are computed from the element each pin names, so they stay
     correct at every width and in either colour scheme.  No animation. */
  function placePins(wrap, frozen, pins) {
    function run() {
      var wr = wrap.getBoundingClientRect();
      if (!wr.width) return;
      pins.forEach(function (p) {
        var target = frozen.querySelector(p.sel);
        if (!target) { p.node.hidden = true; return; }
        p.node.hidden = false;
        var er = target.getBoundingClientRect();
        var x = er.left - wr.left - 25;
        var y = er.top - wr.top + Math.min(er.height, 44) / 2 - 11;
        p.node.style.left = Math.max(0, Math.min(x, wr.width - 24)) + 'px';
        p.node.style.top = Math.max(2, Math.min(y, Math.max(2, wr.height - 24))) + 'px';
      });
    }
    later(run, 0);
    later(run, 160);
    if (window.ResizeObserver) {
      var ro = new window.ResizeObserver(run);
      ro.observe(wrap);
      observers.push(ro);
    }
  }

  /* Each artifact, rendered from the same builder the task screen uses, then
     frozen: inert, so nothing inside can take focus or a key, and out of the
     accessibility tree, because the notes column and the two paragraphs above
     carry everything this picture says. */
  function frozenArtifact(t, fixed) {
    var box = el('div', 'frozen frozen-' + t.artifact + (fixed ? ' is-after' : ' is-before'));
    box.setAttribute('inert', '');
    box.setAttribute('aria-hidden', 'true');
    if (t.artifact === 'sr') {
      box.appendChild(frozenEmail(fixed ? SR_DOCS.t1fixed : SR_DOCS.t1broken));
    } else if (t.artifact === 'site') {
      box.appendChild(buildSite(fixed, null, null, { compact: true, frozen: true }));
    } else if (t.artifact === 'word') {
      box.appendChild(buildWord({
        doc: PROGRAM, fixed: fixed, file: PROGRAM.file,
        only: [fixed ? 9 : 8], paneOpen: true, frozen: true
      }));
    } else if (t.artifact === 'form') {
      box.appendChild(buildForm(fixed, true));
    } else if (t.artifact === 'video') {
      box.appendChild(buildVideo(fixed, null, true));
    }
    return box;
  }

  /* The simulator component builds its own <main> wrapper.  The page already
     has one, and a second main landmark would be wrong, so the mounted copy is
     swapped for a plain container carrying the same children and the same
     width rule.  This is a change to the mounted DOM in the host, not to the
     component's source: nothing the engine looks up moves. */
  function unmarkSimLandmark(root) {
    var m = root.querySelector('main');
    if (!m) return;
    var d = el('div', 'sim-main');
    while (m.firstChild) d.appendChild(m.firstChild);
    m.parentNode.replaceChild(d, m);
  }

  /* The email as the sighted view: the same document frame the simulator
     draws, with the message rendered in it and no console anywhere. */
  function frozenEmail(doc) {
    var frame = el('div', 'sr-sim sr-static');
    frame.innerHTML = '<div class="sim-main"><div class="stage"><div class="doc">' +
      '<div class="chrome"><i></i><i></i><i></i><span></span></div>' +
      '<div><div class="body"></div></div></div></div></div>';
    frame.querySelector('.chrome span').textContent = doc.file;
    frame.querySelector('.body').innerHTML = doc.html;
    return frame;
  }

  /* ============================================ SCREEN: crosswalk 2 of 2 ==
     "Your role": the principle as the heading, what the change enabled, what
     the learner does, then where else this happens. */
  RENDER.crossB = function (node, s) {
    var t = s.task, c = t.crosswalk;
    eyebrow(node, 'Your role');
    heading(node, c.principle);
    lede(node, [c.enabled, c.role], 'rolebody');

    var w = el('div', 'wherelse');
    w.appendChild(txt('h2', null, 'Where else this happens'));
    var ul = document.createElement('ul');
    c.where.forEach(function (i) { ul.appendChild(txt('li', null, i)); });
    w.appendChild(ul);
    node.appendChild(w);

    primary(node, t.key === 't5' ? 'Finish' : 'Continue', function () { go(nextId(s.id)); });
  };

  /* The pieces are laid out by flex gap, which leaves no whitespace in the
     text stream; a screen reader would run them together.  Each piece is
     separated by a real space so the pair reads as a sentence. */
  function joinPieces(parent, pieces) {
    pieces.forEach(function (p, i) {
      if (i) parent.appendChild(document.createTextNode(' '));
      parent.appendChild(p);
    });
    return parent;
  }
  /* Change spec v10 §B.5: the arrow and the second face never separate across
     a line break, so they live in one non-wrapping span; the pair may wrap
     before the arrow. */
  function ratingPair(t) {
    var tail = el('span', 'pairtail');
    joinPieces(tail, [arrowPiece(), txt('span', 'sr-only', 'then'),
      facePiece(faceByValue(state.ratings[t.key][1]))]);
    return joinPieces(el('div', 'pair'), [
      txt('span', 'pair-label', 'How successful you felt:'),
      facePiece(faceByValue(state.ratings[t.key][0])),
      tail
    ]);
  }
  function answerPair(t) {
    if (!t.question) return null;
    return joinPieces(el('div', 'pair answers'), [
      txt('span', 'pair-label', 'Your answers:'),
      answerSide('First version: ', state.answers[t.key][0]),
      arrowPiece(),
      txt('span', 'sr-only', 'then'),
      answerSide('Repaired version: ', state.answers[t.key][1])
    ]);
  }
  /* Change spec v14 §C: a stored answer is { text, correct }.  Only the text
     is echoed here — the closing rows carry no right/wrong mark.  A bare
     string is still accepted, so an older saved session reads cleanly. */
  function answerText(a) {
    if (a == null) return null;
    return typeof a === 'string' ? a : a.text;
  }
  function answerSide(prefix, answer) {
    var label = answerText(answer);
    var s = el('span', 'side');
    s.appendChild(document.createTextNode(prefix));
    var b = document.createElement('b');
    if (label == null) { s.classList.add('none'); b.textContent = 'Not answered'; }
    else b.textContent = endStop(label);
    s.appendChild(b);
    return s;
  }
  function arrowPiece() {
    var a = txt('span', 'arrow', '→');
    a.setAttribute('aria-hidden', 'true');
    return a;
  }
  function facePiece(f) {
    var span = el('span', 'facepair');
    if (!f) { span.appendChild(txt('span', null, 'Not rated')); return span; }
    var e = txt('span', 'emoji', f.emoji);
    e.setAttribute('aria-hidden', 'true');
    span.appendChild(e);
    span.appendChild(txt('span', null, ' ' + f.label));
    return span;
  }

  /* ====================================================== SCREEN: closing ==
     Change spec v10 §H: the exit beat above the summary, then one card per
     task carrying the same things in the same order, so all five weigh the
     same; then the pull-quote and the one restart control in the activity. */
  RENDER.closing = function (node) {
    eyebrow(node, CLOSING.eyebrow);
    heading(node, CLOSING.h1);
    lede(node, [CLOSING.exit], 'exitbeat');
    TASKS.forEach(function (t) {
      var row = el('div', 'sumrow');
      row.appendChild(txt('h2', null, 'Task ' + t.n + ' — ' + t.title));
      row.appendChild(ratingPair(t));
      var ans = answerPair(t);
      if (ans) row.appendChild(ans);
      /* The measured lines sit in the same inset card style as the pairs above
         them, so every task's card carries the same weight (spec v10 §H). */
      if (t.key === 't2' || t.key === 't3') {
        var mbox = el('div', 'measurebox');
        [0, 1].forEach(function (i) {
          var lead = i ? 'Repaired version: ' : 'First version: ';
          var body;
          if (t.key === 't2') {
            var d = state.t2[i];
            body = d ? fmtKeys(d.keys) + ' · ' + fmtDuration(d.ms) : 'not recorded';
          } else {
            var ms = state.times.t3[i];
            body = ms == null ? 'not recorded' : fmtDuration(ms);
          }
          mbox.appendChild(txt('p', 'measure', lead + body));
        });
        row.appendChild(mbox);
      }
      node.appendChild(row);
    });
    var bq = document.createElement('blockquote');
    bq.className = 'pull';
    bq.appendChild(txt('p', null, CLOSING.pull));
    node.appendChild(bq);

    var wrap = el('div', 'actions');
    var b = txt('button', 'btn secondary', CLOSING.restart);
    b.type = 'button';
    wrap.appendChild(b);
    node.appendChild(wrap);

    /* The confirmation lives on this screen, in place: there is no modal
       anywhere in the activity (change spec v10 §B.1). */
    var confirm = el('div', 'restart-confirm');
    confirm.hidden = true;
    var qLine = txt('p', 'restart-q', CLOSING.confirmQ);
    qLine.setAttribute('tabindex', '-1');
    confirm.appendChild(qLine);
    var row2 = el('div', 'row');
    var no = txt('button', 'btn secondary', CLOSING.confirmNo);
    no.type = 'button';
    no.addEventListener('click', function () { confirm.hidden = true; b.focus(); });
    var yes = txt('button', 'btn secondary', CLOSING.confirmYes);
    yes.type = 'button';
    yes.addEventListener('click', restart);
    row2.appendChild(no);
    row2.appendChild(yes);
    confirm.appendChild(row2);
    node.appendChild(confirm);
    b.addEventListener('click', function () { confirm.hidden = false; qLine.focus(); });
  };

  function restart() {
    state.ratings = blankPairs();
    state.answers = blankPairs();
    state.times = { t3: [null, null] };
    state.t3method = [null, null];
    state.t2 = [null, null];
    clearStore();
    go('s0a');
  }

  /* ======================================================= ARTIFACT: site ==
     One barrier: focus order.  Registration is a real <a> in both versions and
     both versions look identical; the first version's DOM simply runs the
     footer before the content and leaves Registration last.  The visual layout
     is pinned by named grid areas (see .vew.v-home), so nothing moves on
     screen when the code order changes. */
  function buildSite(fixed, e, finish, opts) {
    opts = opts || {};
    var frame = el('div', 'mock-browser' + (opts.compact ? ' compact' : ''));
    var chrome = el('div', 'bchrome',
      '<span class="bdots" aria-hidden="true"><i></i><i></i><i></i></span>');
    if (opts.frozen) {
      chrome.appendChild(txt('span', 'urlbar', SITE.url));
    } else {
      var url = document.createElement('input');
      url.type = 'text'; url.className = 'urlbar'; url.readOnly = true;
      url.value = SITE.url;
      url.setAttribute('aria-label', 'Address bar');
      chrome.appendChild(url);
    }
    frame.appendChild(chrome);

    var view = el('div', 'bviewport');
    var page = el('div', 'vew v-home' + (opts.compact ? ' v-compact' : ''));

    var top = '<div class="v-top"><div class="v-mark">Virtual <i>Education</i> Workshops</div>' +
      '<nav class="v-nav" aria-label="Conference site">' +
      SITE.nav.map(function (n) { return '<a href="#">' + n + '</a>'; }).join('') + '</nav></div>';
    var hero = '<div class="v-hero"><h2>' + SITE.hero + '</h2><p>' + SITE.sub + '</p></div>';
    var cta = '<div class="v-ctawrap"><a href="#" class="v-cta" data-role="register">Register now</a></div>';
    var learn = '<div class="v-learnwrap"><a href="#" class="v-learn">Learn more</a></div>';
    var body = opts.compact ? '' : '<div class="v-body">' +
      '<div class="v-sec"><h3>' + SITE.why.h + '</h3><p>' + SITE.why.p + '</p></div>' +
      '<div class="v-sec"><h3>' + SITE.program.h + '</h3><p>' + SITE.program.p + '</p>' +
      '<p><a href="#">' + SITE.program.link + '</a></p></div>' +
      '<div class="v-sec"><h3>' + SITE.sponsors.h + '</h3><div class="v-sponsors">' +
      SITE.sponsors.items.map(function (i) { return '<a href="#">' + i + '</a>'; }).join('') +
      '</div></div></div>';
    var foot = '<div class="v-foot"><nav class="v-footnav" aria-label="Site information">' +
      SITE.footer.map(function (n) { return '<a href="#">' + n + '</a>'; }).join('') +
      '</nav>Virtual Education Workshops is a fictional event.</div>';

    page.innerHTML = fixed
      /* Repaired: code order equals visual order. */
      ? top + hero + cta + learn + body + foot
      /* First version: the footer is coded before the content and Registration
         is coded last, which is how this bug happens in real pages. */
      : top + foot + hero + learn + body + cta;
    view.appendChild(page);
    frame.appendChild(view);
    if (opts.frozen) return frame;

    function openRegistration() {
      view.innerHTML = '';
      var reg = el('div', 'vew');
      /* Change spec v16 §C: the in-artifact "Task complete" status is gone, so
         there is exactly one status announcement for this moment — the line
         below the artifact.  The heading and the paragraph stay. */
      reg.innerHTML = '<div class="v-top"><div class="v-mark">Virtual <i>Education</i> Workshops</div></div>' +
        '<div class="v-regpage"><h2 tabindex="-1" id="reg-heading">Registration</h2>' +
        '<p>Registration for Virtual Education Workshops is open. Continue to the form.</p></div>';
      view.appendChild(reg);
      /* Change spec v16 §C: Task 2 has no question, so it closes with its own
         measurement, in the feedback pattern — the ✓ circle, then the line —
         followed by the Continue button that was already here.  The clock is
         read at this moment, the moment Registration opens. */
      var line = fillMeasures(TASKS[1].doneLine, {
        artKeys: e ? e.artKeys : 0,
        lockMs: (e && e.t0 != null) ? (window.performance.now() - e.t0) : null,
        maxPage: 1
      });
      announce(line);
      if (e && e.postWrap) {
        e.postWrap.innerHTML = '';
        var st = el('div', 'qstatus');
        st.setAttribute('role', 'status');
        var mark = txt('span', 'qmark is-correct', '✓');
        mark.setAttribute('aria-hidden', 'true');
        st.appendChild(mark);
        st.appendChild(txt('span', 'qstatustext', line));
        e.postWrap.appendChild(st);
        /* Change spec v13 §C: an ordinary Continue appears below the artifact,
           so the learner reads the page they just opened instead of being
           jumped away from it.  Nothing is there before this. */
        var acts = el('div', 'actions');
        var b = txt('button', 'btn', 'Continue');
        b.type = 'button';
        b.addEventListener('click', function () { finish('answered'); });
        acts.appendChild(b);
        e.postWrap.appendChild(acts);
        window.setTimeout(function () { b.focus(); }, 60);
      }
    }

    var reg = page.querySelector('[data-role="register"]');
    reg.addEventListener('click', function (ev) { ev.preventDefault(); openRegistration(); });
    reg.addEventListener('keydown', function (ev) {
      if (ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); openRegistration(); }
    });
    return frame;
  }

  /* -------------------------------- the Practice 2 library page ------------
     The mouse is unavailable here too (change spec v10 §D), so the page is
     driven from the keyboard: Enter fires a link's click, and Space is handled
     explicitly because a link does not act on Space by itself. */
  function buildLibraryPractice(onDone) {
    var frame = el('div', 'mock-browser');
    frame.appendChild(el('div', 'bchrome',
      '<span class="bdots" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span class="urlbar">' + LIBRARY.url + '</span>'));
    var view = el('div', 'bviewport');
    var page = el('div', 'mock-lib');
    page.innerHTML = '<h2>' + LIBRARY.h + '</h2>' +
      '<p>' + LIBRARY.p + '</p>' +
      '<nav aria-label="Library"><a href="#" data-lib="about">About</a>' +
      '<a href="#" data-lib="hours">Hours</a><a href="#" data-lib="contact">Contact</a>' +
      '<button type="button" class="lib-search">Search</button></nav>' +
      '<p class="lib-out" role="status"></p>';
    view.appendChild(page);
    frame.appendChild(view);
    var out = page.querySelector('.lib-out');
    function open(which) {
      if (which === 'hours') { out.textContent = LIBRARY.hours; onDone(); }
      else if (which === 'about') { out.textContent = LIBRARY.about; }
      else { out.textContent = LIBRARY.contact; }
    }
    frame.addEventListener('click', function (ev) {
      var a = ev.target.closest ? ev.target.closest('[data-lib]') : null;
      if (!a) return;
      ev.preventDefault();
      open(a.dataset.lib);
    });
    frame.addEventListener('keydown', function (ev) {
      if (ev.key !== ' ' && ev.key !== 'Spacebar') return;
      var a = ev.target.closest ? ev.target.closest('[data-lib]') : null;
      if (!a) return;
      ev.preventDefault();
      open(a.dataset.lib);
    });
    return frame;
  }

  /* ======================================================= ARTIFACT: word ==
     A Word for Windows, Microsoft 365-style window.  Title bar, ribbon tab
     strip with View active, the View tab's "Show" group, and a Navigation pane
     that docks on the left when Navigation Pane is checked or Ctrl+F is
     pressed inside the window.  Text labels only.
     cfg.only limits which page cards render (the pane is still built from the
     whole document); cfg.paneOpen starts with the pane docked; cfg.frozen
     leaves every control unwired. */
  function buildWord(cfg) {
    var doc = cfg.doc, fixed = cfg.fixed;
    var uid = ++qSeq;
    var wrap = el('div', 'mock-word');

    /* ---- title bar ---- */
    var bar = el('div', 'w-title');
    bar.appendChild(txt('span', 'w-file', cfg.file + ' - Word'));
    wrap.appendChild(bar);

    /* ---- ribbon tabs: only View does anything ---- */
    var ribbon = el('div', 'w-ribbon');
    ribbon.setAttribute('role', 'group');
    ribbon.setAttribute('aria-label', 'Ribbon tabs');
    ['Home', 'Insert', 'Layout', 'References', 'Review', 'View'].forEach(function (nm) {
      var b = txt('button', 'w-rtab', nm);
      b.type = 'button';
      if (nm === 'View') { b.classList.add('is-active'); b.setAttribute('aria-pressed', 'true'); }
      else { b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-disabled', 'true'); }
      ribbon.appendChild(b);
    });
    wrap.appendChild(ribbon);

    /* ---- the View tab's Show group ---- */
    var rbody = el('div', 'w-ribbonbody');
    var group = document.createElement('fieldset');
    group.className = 'w-group';
    group.appendChild(txt('legend', null, 'Show'));
    var navCb = null;
    [['Navigation Pane', 'nav']].forEach(function (pair) {
      var id = 'w' + uid + '-' + pair[1];
      var lab = document.createElement('label');
      lab.setAttribute('for', id);
      var input = document.createElement('input');
      input.type = 'checkbox'; input.id = id;
      lab.appendChild(input);
      lab.appendChild(txt('span', null, pair[0]));
      group.appendChild(lab);
      if (pair[1] === 'nav') { input.className = 'w-navcb'; navCb = input; }
    });
    rbody.appendChild(group);
    wrap.appendChild(rbody);

    /* ---- pane + page area ---- */
    var split = el('div', 'w-split pane-closed');
    var pane = document.createElement('nav');
    pane.className = 'w-pane';
    pane.id = 'wpane-' + uid;
    pane.setAttribute('aria-label', 'Navigation');
    pane.hidden = true;
    navCb.setAttribute('aria-controls', pane.id);

    var head = el('div', 'w-panehead');
    var ptitle = txt('p', 'w-panetitle', 'Navigation');
    ptitle.setAttribute('aria-hidden', 'true');
    head.appendChild(ptitle);
    var closeBtn = txt('button', 'w-paneclose', '×');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Close the navigation pane');
    head.appendChild(closeBtn);
    pane.appendChild(head);

    var search = document.createElement('input');
    search.type = 'text';
    search.className = 'w-panesearch';
    search.readOnly = true;
    search.placeholder = 'Search document';
    search.setAttribute('aria-label', 'Search document');
    pane.appendChild(search);

    var tabs = el('div', 'w-panetabs');
    tabs.setAttribute('role', 'group');
    tabs.setAttribute('aria-label', 'Navigation pane views');
    ['Headings', 'Pages', 'Results'].forEach(function (nm) {
      var b = txt('button', null, nm);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(nm === 'Headings'));
      if (nm !== 'Headings') b.setAttribute('aria-disabled', 'true');
      tabs.appendChild(b);
    });
    pane.appendChild(tabs);

    var paneList = document.createElement('ul');
    paneList.className = 'w-panelist';
    pane.appendChild(paneList);
    split.appendChild(pane);

    /* The page area scrolls, so it is a focusable, named region: a keyboard
       user has to be able to scroll the document without a pointer. */
    var pages = el('div', 'w-pages');
    if (!cfg.frozen) {
      pages.setAttribute('tabindex', '0');
      pages.setAttribute('role', 'region');
      pages.setAttribute('aria-label', 'Document pages, scrollable');
    }
    split.appendChild(pages);
    wrap.appendChild(split);

    /* ---- the document, and the pane tree it produces ---- */
    var tree = [];
    doc.pages.forEach(function (pg, pi) {
      var show = !cfg.only || cfg.only.indexOf(pi + 1) !== -1;
      var card = el('div', 'w-page');
      card.setAttribute('data-page', String(pi + 1));
      pg.blocks.forEach(function (b) {
        var n = show ? renderBlock(b, fixed) : null;
        if (n) card.appendChild(n);
        if (b.k !== 'doctitle' && b.k !== 'h') return;
        if (!(fixed || b.nav === 'always')) return;
        var lvl = b.k === 'doctitle' ? 1 : b.lvl;
        var entry = { id: b.id, label: b.text, page: pi + 1, kids: [] };
        if (lvl === 2 && tree.length) tree[tree.length - 1].kids.push(entry);
        else tree.push(entry);
      });
      if (!show) return;
      card.appendChild(txt('p', 'w-foot', 'Page ' + (pi + 1) + ' of ' + doc.pages.length));
      pages.appendChild(card);
    });

    function jumpTo(entry, btn) {
      paneList.querySelectorAll('.w-paneitem').forEach(function (x) { x.removeAttribute('aria-current'); });
      btn.setAttribute('aria-current', 'true');
      var target = pages.querySelector('#' + entry.id);
      if (target) {
        pages.scrollTop = Math.max(0, target.offsetTop - 14);
        target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
        target.classList.add('w-hit');
        later(function () { target.classList.remove('w-hit'); }, 1200);
      }
      if (cfg.onReach) cfg.onReach(entry.page);
      if (cfg.onPane) cfg.onPane(entry.id);
    }

    function renderEntries(list, ul, depth) {
      list.forEach(function (entry) {
        var li = txt('li', 'lv' + depth);
        var row = el('span', 'w-panerow');
        var kidsUl = null;
        if (entry.kids.length) {
          var tw = txt('button', 'w-twisty', '▾');
          tw.type = 'button';
          tw.setAttribute('aria-expanded', 'true');
          tw.setAttribute('aria-label', 'Collapse ' + entry.label);
          tw.addEventListener('click', function () {
            var open = tw.getAttribute('aria-expanded') === 'true';
            tw.setAttribute('aria-expanded', String(!open));
            tw.textContent = open ? '▸' : '▾';
            tw.setAttribute('aria-label', (open ? 'Expand ' : 'Collapse ') + entry.label);
            if (kidsUl) kidsUl.hidden = open;
          });
          row.appendChild(tw);
        } else {
          var sp = el('span', 'w-twisty-sp');
          sp.setAttribute('aria-hidden', 'true');
          row.appendChild(sp);
        }
        var b = txt('button', 'w-paneitem', entry.label);
        b.type = 'button';
        b.setAttribute('data-target', entry.id);
        if (!cfg.frozen) b.addEventListener('click', function () { jumpTo(entry, b); });
        row.appendChild(b);
        li.appendChild(row);
        if (entry.kids.length) {
          kidsUl = document.createElement('ul');
          renderEntries(entry.kids, kidsUl, depth + 1);
          li.appendChild(kidsUl);
        }
        ul.appendChild(li);
      });
    }
    renderEntries(tree, paneList, 1);

    /* ---- opening and closing the pane ---- */
    function setPane(open) {
      pane.hidden = !open;
      split.classList.toggle('pane-closed', !open);
    }
    if (cfg.paneOpen) { navCb.checked = true; setPane(true); }
    if (!cfg.frozen) {
      navCb.addEventListener('change', function () { setPane(navCb.checked); });
      closeBtn.addEventListener('click', function () {
        navCb.checked = false;
        setPane(false);
        navCb.focus();
      });
      /* Ctrl+F (and Cmd+F) opens the pane while focus is inside the window, and
         the browser's own find bar is prevented.  Focus outside the window is
         nobody's business, so nothing is bound above this element. */
      wrap.addEventListener('keydown', function (ev) {
        if (ev.key !== 'f' && ev.key !== 'F') return;
        if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
        ev.preventDefault();
        if (!navCb.checked) { navCb.checked = true; setPane(true); }
        var first = paneList.querySelector('.w-paneitem');
        if (first) first.focus();
      });
    }

    if (cfg.onReach) {
      var ticking = false;
      pages.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(function () {
          ticking = false;
          var cards = pages.querySelectorAll('.w-page');
          var bottom = pages.scrollTop + pages.clientHeight - 60;
          var reached = 1;
          for (var i = 0; i < cards.length; i++) if (cards[i].offsetTop < bottom) reached = i + 1;
          cfg.onReach(reached);
        });
      });
    }
    return wrap;
  }

  /* One content array, two renderings: the words and their order never change;
     only whether a title is a real heading style or hand formatting does. */
  function renderBlock(b, fixed) {
    if (b.k === 'doctitle') {
      var h = txt('h2', 'w-doctitle', b.text);
      h.id = b.id;
      return h;
    }
    if (b.k === 'sub') return txt('p', 'w-docsub', b.text);
    if (b.k === 'p') return txt('p', null, b.text);
    if (b.k === 'ul') {
      var ul = document.createElement('ul');
      b.items.forEach(function (i) { ul.appendChild(txt('li', null, i)); });
      return ul;
    }
    if (b.k === 'h') {
      var real = fixed || b.nav === 'always';
      if (real) {
        var n = txt(b.lvl === 2 ? 'h4' : 'h3', b.lvl === 2 ? 'rh2' : 'rh1', b.text);
        n.id = b.id;
        return n;
      }
      var p = txt('p', 'mh mh-' + (b.m || 'bold'), b.text);
      p.id = b.id;
      return p;
    }
    return null;
  }

  /* ======================================================= ARTIFACT: form ==
     Change spec v10 §F.  The first version carries three things and nothing
     else: placeholder text as the only label, required status in colour alone
     (a coloured left border, no symbol and no word), and the two email fields
     back to back with nothing between them.  No helper text at all, so there
     is no low-contrast text in it.  The repaired version gives every field a
     persistent visible label, says "(required)" in words, and keeps helper
     text with the field it belongs to. */
  function buildForm(fixed, frozen) {
    var frame = el('div', 'mock-browser fit');
    frame.appendChild(el('div', 'bchrome',
      '<span class="bdots" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span class="urlbar">' + SITE.url + '/register</span>'));
    var view = el('div', 'bviewport');
    var brand = el('div', 'vew');
    brand.innerHTML = '<div class="v-top"><div class="v-mark">Virtual <i>Education</i> Workshops</div></div>';
    view.appendChild(brand);

    var form = document.createElement('form');
    form.className = 'vform ' + (fixed ? 'is-fixed' : 'is-broken');
    form.setAttribute('novalidate', '');
    form.appendChild(txt('h2', null, 'Register for Virtual Education Workshops'));
    form.appendChild(txt('p', 'f-intro', 'Step 2 of 2 · Review and submit'));
    var sfx = fixed ? '-r' : '-b';

    FORM_FIELDS.forEach(function (f) {
      var row = el('div', 'f-row');
      var input = document.createElement('input');
      input.type = f.type === 'email' ? 'email' : 'text';
      input.id = f.id + sfx;
      input.value = f.value;
      if (fixed) {
        var lab = txt('label', null, f.label);
        lab.setAttribute('for', input.id);
        row.appendChild(lab);
        if (f.help) {
          var h = txt('p', 'f-help above', f.help);
          h.id = input.id + '-help';
          row.appendChild(h);
          input.setAttribute('aria-describedby', h.id);
        }
        row.appendChild(input);
      } else {
        /* DELIBERATE BARRIER: the placeholder is the only label, so a filled
           field shows nothing about its purpose, and required status is a
           colour and nothing else. */
        input.placeholder = f.ph;
        if (f.req) input.classList.add('is-reqcolor');
        row.appendChild(input);
      }
      form.appendChild(row);
    });

    var check = el('div', 'f-check');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = 'f-agree' + sfx; cb.checked = true;
    check.appendChild(cb);
    if (fixed) {
      var cl = txt('label', 'f-agree', FORM_CONSENT);
      cl.setAttribute('for', cb.id);
      check.appendChild(cl);
    } else {
      /* DELIBERATE BARRIER: plain text, no label element, and the same
         colour-only required treatment as the fields above. */
      check.appendChild(txt('span', 'f-agree is-reqcolor', FORM_CONSENT_BROKEN));
    }
    form.appendChild(check);

    var sub = txt('button', 'f-submit', 'Submit registration');
    sub.type = 'button';
    var status = txt('p', 'f-status', '');
    status.setAttribute('role', 'status');
    if (!frozen) sub.addEventListener('click', function () { status.textContent = 'Not needed for this task.'; });
    form.appendChild(sub);
    form.appendChild(status);
    form.addEventListener('submit', function (ev) { ev.preventDefault(); });

    view.appendChild(form);
    frame.appendChild(view);
    return frame;
  }

  /* ====================================================== ARTIFACT: video == */
  function buildVideo(fixed, e, frozen) {
    var wrap = el('div', 'mock-video');
    var stage = el('div', 'vstage');
    stage.innerHTML =
      '<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">' +
      '<rect x="0" y="0" width="320" height="180" fill="#161B22"/>' +
      '<circle cx="258" cy="46" r="30" fill="#1D242E"/>' +
      '<rect x="44" y="52" width="42" height="30" rx="3" fill="#1D242E"/>' +
      '<rect x="0" y="146" width="320" height="34" fill="#232B34"/>' +
      '<rect x="0" y="144" width="320" height="3" fill="#333D4B"/>' +
      '<g class="pres-body">' +
      '<path d="M118 180 C118 138 134 124 160 124 C186 124 202 138 202 180 Z" fill="#2E4A7A"/>' +
      '<path d="M149 125 L160 141 L171 125 Z" fill="#223C68"/>' +
      '<rect x="152" y="104" width="16" height="24" rx="6" fill="#B4835F"/>' +
      '<circle cx="160" cy="92" r="20" fill="#C99A78"/>' +
      '<path d="M140 92 C140 72 180 72 180 92 C180 80 172 74 160 74 C148 74 140 80 140 92 Z" fill="#3A2A20"/>' +
      '</g></svg>' +
      '<p class="vchip">Sound unavailable</p>' +
      '<div class="vcc" aria-live="off"></div>';
    wrap.appendChild(stage);

    var ctrl = el('div', 'vctrl');
    var play = txt('button', null, 'Play');
    play.type = 'button';
    var replay = txt('button', null, 'Replay');
    replay.type = 'button';
    var bar = el('div', 'vbar', '<i></i>');
    bar.setAttribute('aria-hidden', 'true');
    var time = txt('span', 'vtime', '0:00 / 0:25');
    ctrl.appendChild(play);
    ctrl.appendChild(replay);
    ctrl.appendChild(bar);
    ctrl.appendChild(time);
    wrap.appendChild(ctrl);

    var cc = stage.querySelector('.vcc');
    var fill = bar.querySelector('i');
    var t = 0, tick = null, playing = false;

    function paint() {
      fill.style.width = Math.min(100, (t / CLIP.duration) * 100) + '%';
      var s = Math.min(CLIP.duration, Math.floor(t));
      time.textContent = '0:' + String(s).padStart(2, '0') + ' / 0:' + CLIP.duration;
      if (fixed) {
        var line = '';
        for (var i = 0; i < CLIP.cues.length; i++) {
          if (t >= CLIP.cues[i][0] && t < CLIP.cues[i][1]) { line = CLIP.cues[i][2]; break; }
        }
        if (cc.getAttribute('data-line') !== line) {
          cc.setAttribute('data-line', line);
          cc.innerHTML = line ? '<span></span>' : '';
          if (line) cc.firstChild.textContent = line;
        }
      }
    }
    function stop() {
      playing = false;
      window.clearInterval(tick);
      tick = null;
      stage.classList.remove('is-playing');
      play.textContent = 'Play';
    }
    function start() {
      if (playing) return;
      if (t >= CLIP.duration) t = 0;
      playing = true;
      stage.classList.add('is-playing');
      play.textContent = 'Pause';
      var last = window.performance.now();
      tick = every(function () {
        var now = window.performance.now();
        t += (now - last) / 1000;
        last = now;
        if (t >= CLIP.duration) {
          t = CLIP.duration;
          paint();
          stop();
          if (cc) { cc.setAttribute('data-line', ''); cc.innerHTML = ''; }
          if (e && e.onClipEnd) e.onClipEnd();
          return;
        }
        paint();
      }, 100);
    }
    if (!frozen) {
      play.addEventListener('click', function () { playing ? stop() : start(); });
      replay.addEventListener('click', function () { stop(); t = 0; paint(); start(); });
    } else if (fixed) {
      /* The frozen repaired player is held on one caption cue, so the picture
         shows what the repair added. */
      t = 7;
    }
    paint();

    if (fixed) {
      var det = document.createElement('details');
      det.className = 'vtranscript';
      if (frozen) det.open = true;
      var sum = txt('summary', null, 'Transcript');
      det.appendChild(sum);
      det.appendChild(txt('p', null, CLIP.transcript));
      wrap.appendChild(det);
    }
    return wrap;
  }

  /* Mock links inside the artifacts never navigate. */
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href="#"]') : null;
    if (a) ev.preventDefault();
  });

  /* ================================================================= boot == */
  var saved = load();
  if (saved && byId[saved.screen]) {
    state.ratings = saved.ratings || state.ratings;
    state.answers = saved.answers || state.answers;
    state.times = saved.times || state.times;
    state.t3method = saved.t3method || state.t3method;
    state.t2 = saved.t2 || state.t2;
    go(saved.screen);
  } else {
    go('cover');
  }
})();
</script>
