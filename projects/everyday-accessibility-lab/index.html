<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Accessibility Lab — One conference. Five tasks.</title>
<meta name="description" content="A five-task learning lab for public-sector staff. Each task shows one everyday digital moment as it is often built, then the same moment improved.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ===== inlined from parts/sr-simulator.css (host changes marked inline) ===== */
/*
 * sr-simulator.css
 * Extracted verbatim (values unchanged) from:
 *   sr-simulator/index.html, lines 9-99  (the newest of the two sr-simulator
 *   source files — see sr-simulator.js README for the diff against the
 *   older sr-simulator.html, which turned out to be byte-identical CSS).
 *
 * DECOUPLING NOTE (the only intentional change from the source):
 * The original file owned the whole document (`body`, `h1,h2,h3`, `p`,
 * `button`, `kbd`, `:focus-visible`, `.sr-only`) because it was a standalone
 * page. To make this component safe to drop into another page without its
 * bare-element rules bleeding onto the host page, every such rule below is
 * now scoped under a `.sr-sim` root class (the mount element the JS creates
 * — see sr-simulator.js). Class-scoped rules (.rail, .doc, .console, etc.)
 * are untouched. No property value, color, size, or spacing was changed.
 * Original selector -> scoped selector map:
 *   body                 -> .sr-sim
 *   h1, h2, h3            -> .sr-sim h1, .sr-sim h2, .sr-sim h3
 *   p                     -> .sr-sim p
 *   button                -> .sr-sim button
 *   :focus-visible        -> .sr-sim :focus-visible
 *   .sr-only              -> .sr-sim .sr-only   (class already scoped-looking, kept consistent)
 *   kbd                   -> .sr-sim kbd
 *   *                     -> .sr-sim, .sr-sim *   (box-sizing reset)
 */

:root {
  --ground: #F1F3F0; --paper: #FFFFFF; --ink: #1A1F1D; --ink-2: #4A5350; --ink-3: #78827E; --line: #D3D8D4;
  --accent: #14515E; --accent-ink: #FFFFFF; --accent-soft: #DCE9EC;
  --barrier: #9C3A2E; --barrier-soft: #F5E3DF; --fixed: #2A6B4A; --fixed-soft: #DDEDE3;
  --console-bg: #101615; --console-ink: #D9E5DF; --console-dim: #6E7F79; --console-hi: #8FD9C1;
  --focus: #E0A100; --shadow: 0 1px 2px rgba(20,30,26,.08), 0 8px 24px rgba(20,30,26,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15191A; --paper: #1E2426; --ink: #ECEEEA; --ink-2: #B8C0BC; --ink-3: #7F8985; --line: #35403D;
    --accent: #6FB8C4; --accent-ink: #0F1A1D; --accent-soft: #1E3A40;
    --barrier: #E38A7C; --barrier-soft: #3B2622; --fixed: #86C9A4; --fixed-soft: #1F3A2C;
    --console-bg: #0A0E0D; --focus: #FFC53D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ground: #15191A; --paper: #1E2426; --ink: #ECEEEA; --ink-2: #B8C0BC; --ink-3: #7F8985; --line: #35403D;
  --accent: #6FB8C4; --accent-ink: #0F1A1D; --accent-soft: #1E3A40;
  --barrier: #E38A7C; --barrier-soft: #3B2622; --fixed: #86C9A4; --fixed-soft: #1F3A2C;
  --console-bg: #0A0E0D; --focus: #FFC53D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

.sr-sim, .sr-sim * { box-sizing: border-box; }
.sr-sim { margin: 0; background: var(--ground); color: var(--ink); font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
.sr-sim h1, .sr-sim h2, .sr-sim h3 { font-family: "Bricolage Grotesque", "Source Sans 3", system-ui, sans-serif; line-height: 1.1; text-wrap: balance; margin: 0; }
.sr-sim p { margin: 0; }
.sr-sim button { font: inherit; cursor: pointer; }
.sr-sim :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-sim .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr-sim .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); }
.sr-sim kbd { font-family: "JetBrains Mono", monospace; font-size: 12px; background: var(--ground); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }

/* ---------------------------------------------------------------------------
   HOST CHANGE (build v6, change spec §A).  The component's own chrome is gone,
   so the rules that dressed it — header.rail / .brand / .seg / .spacer /
   .voice / .head / .btn / .card / .notes — are deleted with the markup they
   styled.  The stage is now a single stacked column: the document frame at
   full width, the console below it, and one toolbar row welded to the
   console's top edge.  Nothing else in this file changed.
   --------------------------------------------------------------------------*/
.sr-sim main { width: 100%; max-width: 1000px; margin: 0; padding: 0; }

.sr-sim .stage { display: flex; flex-direction: column; gap: 18px; }

/* HOST CHANGE (build v7, change spec v7 §G): the document frame keeps ONE
   height across the sighted and the dark state, so nothing on the page moves
   when the screen goes off or on.  --doc-h is that height; the email frame
   (.doc-email) is taller than the practice notice because its content is. */
.sr-sim { --doc-h: 420px; }
.sr-sim.doc-email { --doc-h: 580px; }
@media (max-width: 720px) {
  .sr-sim { --doc-h: 460px; }
  .sr-sim.doc-email { --doc-h: 640px; }
}

.sr-sim .doc { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
/* min-height pins the title bar to the height it has WITH the Show screen
   toggle, so the sighted pre-reveal frame (which has no toggle) is exactly as
   tall as the frame that replaces it (change spec v7 §G). */
.sr-sim .doc .chrome { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); align-items: center; min-height: 49px; }
.sr-sim .doc .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.sr-sim .doc .chrome span { margin-left: 8px; }
/* Show screen: a small viewer control at the right end of the title bar
   (change spec v7 §F).  Quieter than anything the learner is meant to use. */
.sr-sim .doc .chrome .doc-peek {
  margin-left: auto; background: transparent; border: 1px dashed var(--line);
  color: var(--ink-2); font-size: 13px; font-weight: 600; border-radius: 6px; padding: 5px 10px;
}
.sr-sim .doc .chrome .doc-peek:hover { color: var(--ink); }
.sr-sim .doc .chrome .doc-peek[aria-pressed="true"] { background: var(--accent-soft); border-style: solid; border-color: var(--accent); color: var(--ink); }
.sr-sim .doc .body { padding: 28px 32px; font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #1A1A1A; background: #FFFFFF; height: var(--doc-h); overflow-y: auto; position: relative; }
.sr-sim .doc .body .cur { outline: 3px solid #E0A100; outline-offset: 2px; background: #FFF4D6; }
/* The screen-off state paints over exactly the same box and holds one label,
   in the shell's sans face — not the console's monospace (change spec §A.4). */
.sr-sim .doc .screen-off { background: var(--console-bg); height: var(--doc-h); display: grid; place-items: center; padding: 32px; }
.sr-sim .doc .screen-off .screen-off-label {
  color: var(--console-ink); font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: .02em; text-align: center;
}

.sr-sim .side { display: flex; flex-direction: column; }
.sr-sim .console { background: var(--console-bg); color: var(--console-ink); border-radius: 0 0 8px 8px; padding: 14px 16px; font-family: "JetBrains Mono", monospace; font-size: 14px; min-height: 200px; max-height: 300px; overflow-y: auto; box-shadow: var(--shadow); }
.sr-sim .console .label { color: var(--console-dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
.sr-sim .console .line { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.06); color: var(--console-dim); }
.sr-sim .console .line:last-child { color: var(--console-hi); border-bottom: 0; }
.sr-sim .console .line.alert { color: #F2B8A6; }
/* The console toolbar (change spec §A.3, trimmed by v7 §F): one row welded to
   the console's top edge, holding the four keys and Voice on/off.  Restart is
   gone, and Show screen moved into the document frame's title bar. */
.sr-sim .keys {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--paper); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 8px 8px 0 0; padding: 10px 12px;
}
.sr-sim .key { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.sr-sim .key:disabled { opacity: .45; cursor: not-allowed; }
.sr-sim .key[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

/* simulated documents (built-in default sample docs — flyer / memo / news) */
.sr-sim .flyer { text-align: center; }
.sr-sim .flyer .art { margin: 0 auto; width: 100%; max-width: 380px; aspect-ratio: 4/5; border-radius: 4px; background: linear-gradient(160deg, #1B3B6F 0%, #2F6DB5 55%, #F2B233 55.5%, #F2B233 100%); color: #fff; display: grid; place-items: center; padding: 24px; font-family: Impact, "Arial Black", sans-serif; }
.sr-sim .flyer .art .t1 { font-size: 34px; letter-spacing: .02em; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.sr-sim .flyer .art .t2 { font-size: 18px; margin-top: 10px; font-family: Calibri, Arial, sans-serif; font-weight: 700; }
.sr-sim .flyer .art .t3 { font-size: 15px; margin-top: 30px; font-family: Calibri, Arial, sans-serif; color: #1B1B1B; font-weight: 700; }
.sr-sim .flyer .under { text-align: left; margin-top: 16px; font-size: 14px; }
.sr-sim .memo p, .sr-sim .news p { margin: 0 0 10px; font-size: 14px; line-height: 1.45; }
.sr-sim .memo .h { font-weight: 700; font-size: 16px; margin-top: 14px; }
.sr-sim .news a { color: #0563C1; }
/* ===== end sr-simulator.css ===== */
/* ==========================================================================
   PART 1 — THE SHELL.  Design System B ("Ten Minutes Without").
   Everything in this section belongs to the learning tool itself: the header
   rail, the screens, the buttons, cards, callouts, directions blocks, the
   rating faces, the crosswalk, the options dialog.  Tokens and component
   recipes are lifted from parts/design-system.md, System B, and extended in
   the same idiom where System B had no equivalent component.
   The mocked artifacts start at PART 2 and deliberately do NOT use any of it.
   ========================================================================== */

/* --- Tokens: System B (Ten Minutes Without), the complete set -------------
   Identical values to the sr-simulator block above, plus --amber/--amber-soft
   which the reduced sr-simulator set drops.  Two deliberate changes, both to
   satisfy this activity's own WCAG 2.1 AA requirement (build spec §1.1):
     --console-dim  #6E7F79 -> #798A84  (was 4.27:1 on --console-bg, now 5.0:1)
     --ink-3        #78827E -> #656F6B  (was 3.6:1 on --ground, now 4.7:1;
                    dark  #7F8985 -> #8A948F, was 4.4:1 on --paper, now 5.1:1)
   Shell eyebrows and meta text additionally use --ink-2, not --ink-3.
   -------------------------------------------------------------------------*/
:root {
  --ground: #F1F3F0;
  --paper: #FFFFFF;
  --ink: #1A1F1D;
  --ink-2: #4A5350;
  --ink-3: #656F6B;
  --line: #D3D8D4;
  --accent: #14515E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE9EC;
  --barrier: #9C3A2E;
  --barrier-soft: #F5E3DF;
  --fixed: #2A6B4A;
  --fixed-soft: #DDEDE3;
  --amber: #B0640A;
  --amber-soft: #F6E9D6;
  --console-bg: #101615;
  --console-ink: #D9E5DF;
  --console-dim: #798A84;
  --console-hi: #8FD9C1;
  --focus: #E0A100;
  --shadow: 0 1px 2px rgba(20,30,26,.08), 0 8px 24px rgba(20,30,26,.06);
  --display: "Bricolage Grotesque", "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15191A; --paper: #1E2426; --ink: #ECEEEA; --ink-2: #B8C0BC; --ink-3: #8A948F;
    --line: #35403D; --accent: #6FB8C4; --accent-ink: #0F1A1D; --accent-soft: #1E3A40;
    --barrier: #E38A7C; --barrier-soft: #3B2622; --fixed: #86C9A4; --fixed-soft: #1F3A2C;
    --amber: #E4A24C; --amber-soft: #3A2E1C;
    --console-bg: #0A0E0D; --console-ink: #D9E5DF; --console-dim: #798A84; --console-hi: #8FD9C1;
    --focus: #FFC53D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ground: #15191A; --paper: #1E2426; --ink: #ECEEEA; --ink-2: #B8C0BC; --ink-3: #8A948F;
  --line: #35403D; --accent: #6FB8C4; --accent-ink: #0F1A1D; --accent-soft: #1E3A40;
  --barrier: #E38A7C; --barrier-soft: #3B2622; --fixed: #86C9A4; --fixed-soft: #1F3A2C;
  --amber: #E4A24C; --amber-soft: #3A2E1C;
  --console-bg: #0A0E0D; --console-ink: #D9E5DF; --console-dim: #798A84; --console-hi: #8FD9C1;
  --focus: #FFC53D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

/* Focus. System B's amber ring, extended with an adjacent dark ring so the
   indicator keeps >=3:1 against both the pale shell and the navy artifact
   headers (System B's bare amber ring is 2.0:1 on --ground). */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  box-shadow: 0 0 0 2px var(--ink);
  border-radius: 2px;
}
/* Scripted focus targets are not controls.  The router parks focus on each
   screen's h1 so a screen reader reads the new screen; painting a ring there
   would tell a sighted learner they had landed on something operable. */
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible,
main:focus, main:focus-visible { outline: none; box-shadow: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip {
  position: absolute; left: 8px; top: -60px; z-index: 60;
  background: var(--accent); color: var(--accent-ink);
  padding: 10px 16px; border-radius: 0 0 6px 6px; font-weight: 700;
  text-decoration: none; transition: top .15s ease;
}
.skip:focus { top: 0; }

/* --- Header rail --------------------------------------------------------- */
.app-rail {
  background: var(--paper); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.rail-in {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.wordmark {
  font-family: var(--display); font-weight: 800; font-size: 17px;
  letter-spacing: -.01em; white-space: nowrap;
}
/* Change spec v13 §A: the ticks, the chip and the hidden progress sentence are
   replaced by one named bar — a single flex row of numbered step names, three
   states and nothing else.  No lines, no fill, no check marks, no chip.  The
   min-width is what forces the row to wrap onto its own line below about
   1100 px; `.rail-in` already carries the flex-wrap that lets it. */
.progress { flex: 1 1 auto; min-width: min(840px, 100%); }
.steps-list {
  display: flex; gap: 22px; align-items: baseline;
  list-style: none; margin: 0; padding: 0; white-space: nowrap;
  /* One row wherever the row is wide enough to hold it.  The wrap is a safety
     valve only: it is what keeps a narrow header from pushing the page into a
     horizontal scroll when the web font has not loaded and the fallback face
     sets the names wider than the design does. */
  /* Change spec v14 §A: the bar shows every item at every width, so the wrap
     is no longer a safety valve — it is the layout.  The list takes as many
     lines as it needs and items never clip. */
  flex-wrap: wrap; row-gap: 4px;
}
.steps-list li {
  display: flex; align-items: baseline; gap: 7px;
  /* a transparent rule on every item so the current item's underline does not
     move the row by 2 px when it changes screens */
  border-bottom: 2px solid transparent; padding-bottom: 3px;
}
.step-n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.step-name { font-family: var(--body); font-size: 14px; font-weight: 400; color: var(--ink); }
.steps-list li[data-state="now"] { border-bottom-color: var(--accent); }
.steps-list li[data-state="now"] .step-name { font-weight: 600; color: var(--ink); }
.steps-list li[data-state="done"] .step-n,
.steps-list li[data-state="done"] .step-name { color: var(--ink-3); font-weight: 400; }

/* --- Buttons (System B: base .btn is the filled/primary look) ------------- */
.btn {
  border: 0; border-radius: 6px; padding: 12px 22px;
  font-weight: 700; font-size: 17px;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: var(--shadow); text-decoration: none; display: inline-block;
}
.btn:hover { filter: brightness(1.12); }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.secondary:hover { background: var(--paper); filter: none; }
.btn.small { padding: 6px 14px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }

/* --- Screens ------------------------------------------------------------- */
main { flex: 1; width: 100%; }
main:focus { outline: none; }
.screen { max-width: 1180px; margin: 0 auto; padding: 30px 20px 72px; }
.screen:focus { outline: none; }
.col { max-width: 68ch; }
.col-wide { max-width: 1140px; }
.eyebrow {
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 700; color: var(--ink-2); margin-bottom: 8px;
}
.screen h1 { font-size: clamp(28px, 4.2vw, 40px); font-weight: 700; letter-spacing: -.02em; margin-bottom: 16px; }
.screen h1:focus { outline: none; }
.screen h2 { font-size: 21px; font-weight: 700; margin: 28px 0 8px; }
.screen h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
.lede p + p { margin-top: 14px; }
.lede p { color: var(--ink-2); }
.lede p.first { color: var(--ink); font-size: 19px; }
.meta { margin-top: 20px; font-size: 15px; color: var(--ink-2); }
.actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* --- The cover (change spec v15 §A) ---------------------------------------
   One centred column between the rail and the footer, with no card and no
   panel.  The choreography is the Title scene of the author's Claude Design
   export ported to CSS keyframes — the timings, the order and the proportions
   only.  Every colour and every face here is a shell token: --display for the
   heading, --body for the rest, --accent for the eyebrow, the bar and the
   rule, --ink for the heading, --ink-2 for the subtitle, --ground behind it
   all.  Nothing new is loaded.
   The STATIC state is what is written below; the motion lives entirely under
   `.cover.is-animated`, a class the router adds only when the learner has not
   asked for reduced motion.  Without JS, or with `prefers-reduced-motion:
   reduce`, every element is already at its final state and the bar is not
   rendered at all.
   --------------------------------------------------------------------------*/
main.is-cover { display: flex; flex-direction: column; }
.screen.cover {
  flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
  align-items: center; width: 100%; max-width: 820px; text-align: center;
}
.cover-eyebrow {
  font-family: var(--body); font-size: 15px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; color: var(--accent);
  margin: 0 0 28px;
}
.screen.cover .cover-h1 {
  font-family: var(--display); font-size: clamp(52px, 9.5vw, 120px); font-weight: 800;
  line-height: .98; letter-spacing: -.02em; color: var(--ink); margin: 0;
  /* the two lines are set by the <br>; nothing else may re-balance them */
  text-wrap: wrap;
}
.cover-bar {
  display: inline-block; width: 5px; height: .72em; margin-left: .1em;
  vertical-align: -.08em; background: var(--accent);
}
.cover-rule {
  height: 4px; width: 190px; border-radius: 4px; background: var(--accent);
  margin: 36px auto 0;
}
.cover-sub {
  font-family: var(--body); font-size: clamp(19px, 2.4vw, 28px); line-height: 1.45;
  color: var(--ink-2); margin: 34px auto 0; max-width: 30ch;
}
.screen.cover .actions { margin-top: 44px; justify-content: center; }
/* The static cover has no bar: a blinking caret that never blinks is noise. */
.cover:not(.is-animated) .cover-bar { display: none; }

/* --- The cover's choreography (change spec v15 §A) ------------------------
   `rise` is MOTION.rise from the export (opacity + a translateY that eases out
   on a cubic), `cover-draw` is MOTION.draw on the rule's width, `cover-scene`
   is the Scene wrapper's 0.5 s cross-dissolve, and `cover-blink` is the title
   caret at 1.6 Hz.  Every delay and duration below is the export's, and
   `animation-fill-mode: both` holds the `from` frame through the delay so a
   piece never flashes at full strength before its turn.
   --------------------------------------------------------------------------*/
@keyframes cover-scene { from { opacity: 0; } to { opacity: 1; } }
@keyframes cover-rise {
  from { opacity: 0; transform: translateY(var(--dy)); }
  to { opacity: 1; transform: none; }
}
@keyframes cover-draw { from { width: 0; } to { width: 190px; } }
@keyframes cover-blink {
  0%, 49.9% { opacity: 1; }
  50%, 100% { opacity: .15; }
}
@keyframes cover-blink-out { from { opacity: 0; } to { opacity: 0; } }
.screen.cover.is-animated { animation: cover-scene .5s cubic-bezier(.33, 1, .68, 1) both; }
.cover.is-animated .cover-eyebrow,
.cover.is-animated .cover-h1,
.cover.is-animated .cover-sub,
.cover.is-animated .cover-start {
  animation-name: cover-rise; animation-timing-function: cubic-bezier(.33, 1, .68, 1);
  animation-fill-mode: both;
}
.cover.is-animated .cover-eyebrow { --dy: 22px; animation-delay: .15s; animation-duration: .6s; }
.cover.is-animated .cover-h1 { --dy: 28px; animation-delay: .35s; animation-duration: .8s; }
.cover.is-animated .cover-sub { --dy: 22px; animation-delay: 1.4s; animation-duration: .7s; }
.cover.is-animated .cover-start { --dy: 18px; animation-delay: 2.3s; animation-duration: .6s; }
.cover.is-animated .cover-rule {
  animation: cover-draw .9s cubic-bezier(.65, 0, .35, 1) 1.1s both;
}
/* Six cycles at 1.6 Hz from 0.35 s, then the caret is gone for good: the
   second animation is later in the list, so its `opacity: 0` wins from the
   moment it starts filling. */
.cover.is-animated .cover-bar {
  animation: cover-blink .625s linear .35s 6 both,
             cover-blink-out .001s linear 4.1s forwards;
}
/* A keyboard learner who reaches Start before its turn sees it at once.  The
   spec names `:focus-visible`; `:focus` is carried alongside it so a pointer
   learner who clicks into the button mid-sequence sees the same thing, and
   both are written at the depth of the rule they have to beat. */
.cover.is-animated .cover-start:focus-visible,
.cover.is-animated .cover-start:focus { animation: none; opacity: 1; transform: none; }

/* --- Change spec v12 §A: orientation 1 ----------------------------------
   Three pieces the shell had no equivalent for, built from the System B
   tokens already above and nothing else: the subtitle that stands in for the
   eyebrow, the POUR list, and the references block.  Every colour here is
   --ink, --ink-2 or --accent on --ground, which is 7.1:1 or better in both
   schemes, so the small type still clears AA. */
.subtitle {
  max-width: 62ch; margin: -4px 0 20px;
  font-family: var(--body); font-size: clamp(19px, 2.2vw, 22px); font-weight: 400;
  line-height: 1.35; color: var(--ink-2); text-wrap: balance;
}
/* With a subtitle above it, the first body paragraph is a body paragraph:
   the lead has already been set, so nothing competes with it. */
.lede.flat p.first { color: var(--ink-2); font-size: 17px; }
.pourlist { margin: 14px 0 0; padding-left: 24px; color: var(--ink-2); }
/* `.lede p + p` cannot see a paragraph that follows the list, so the list
   carries the gap on its own side. */
.lede .pourlist + p { margin-top: 14px; }
.pourlist li { margin-top: 8px; }
.pourlist li::marker { color: var(--ink-3); }
.pourlist b { color: var(--ink); font-weight: 700; }
.refs {
  max-width: 68ch; margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
}
/* The same small-label recipe the controls block's own heading uses. */
.screen .refs h2 {
  font-family: var(--body); font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; font-weight: 700; color: var(--ink-2); margin: 0 0 10px;
}
.ref {
  font-size: 14px; line-height: 1.5; color: var(--ink-2);
  padding-left: 24px; text-indent: -24px;
}
.ref + .ref { margin-top: 10px; }
/* The shell's own link colour, kept underlined so the link is not signalled
   by colour alone, and allowed to break so a long URL never widens the page. */
.ref a { color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }

/* --- Cards, callouts, directions ----------------------------------------- */
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 18px; box-shadow: var(--shadow); font-size: 15px; color: var(--ink-2);
}
.card b { color: var(--ink); }
.callout {
  margin-top: 26px; padding: 14px 16px; border-left: 3px solid var(--amber);
  background: var(--paper); border-radius: 0 6px 6px 0; box-shadow: var(--shadow);
  font-size: 15px; color: var(--ink-2); max-width: 68ch;
}
.callout b, .callout strong { color: var(--ink); }
/* --- The v10 screen pattern (change spec v10 §F, tool line removed by
   change spec v17 §B) ---------------------------------------------------
   A task screen: the story paragraph.  A repaired screen: the repair lines,
   then the goal line.  Both carry the labelled controls block only where §E
   allows one. */
.instruction { max-width: 68ch; font-size: 19px; color: var(--ink); margin-top: 4px; }
.bodylines .instruction + .instruction { margin-top: 12px; }
.lede + .instruction { margin-top: 16px; }
.controls {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px 12px; box-shadow: var(--shadow);
  margin: 20px 0 6px; max-width: 46ch;
}
.controls .controls-label {
  font-family: var(--body); font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; font-weight: 700; color: var(--ink-2); margin: 0 0 10px;
}
/* Two columns sized to the widest control in this block, so a block of single
   keys is tight and the Word block is wide. */
.controls dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; column-gap: 18px; row-gap: 8px; align-items: baseline; }
.controls .crow { display: contents; }
.controls dt { margin: 0; }
.controls dd { margin: 0; color: var(--ink-2); font-size: 15px; }
.controls dt b { color: var(--ink); font-weight: 700; font-size: 15px; }
.controls kbd, .card kbd {
  font-family: var(--mono); font-size: 12px; background: var(--ground);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 7px;
  color: var(--ink); white-space: nowrap;
}
/* Change spec v13 §E: the practice completion line is a statement, not an
   alert — no box, no left rule, no fill.  One small circled check, then the
   sentence in body text. */
.donenote:not(:empty) {
  margin: 16px 0 0; display: flex; align-items: flex-start; gap: 10px;
  font-size: 16px; color: var(--ink); max-width: 78ch;
}
.donecheck {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  background: var(--fixed-soft); color: var(--fixed);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; line-height: 1; font-weight: 700;
  /* the circle rides with the first line of the statement */
  margin-top: 2px;
}
.donenote b { font-weight: 700; }

/* --- Artifact wrapper (the shell's frame around a mock) ------------------- */
.artifact { margin: 22px 0 0; }
.artifact.no-pointer { pointer-events: none; }
.qblock { margin: 26px 0 0; max-width: 68ch; }
.qblock fieldset { border: 0; margin: 0; padding: 0; }
.qblock legend {
  font-family: var(--display); font-size: 21px; font-weight: 700;
  padding: 0; margin-bottom: 12px; color: var(--ink);
}
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts label {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  background: var(--paper);
}
.opts label:hover { border-color: var(--ink-3); }
.opts label.is-checked { border-color: var(--accent); background: var(--accent-soft); }
.opts input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
/* Change spec v13 §C: the fail-safe is gone.  Task 2's post-completion
   Continue lands in an ordinary actions slot, which stays out of the layout
   until something is put in it.  Change spec v16 §C: that slot is now a plain
   block holding the completion line and then the actions row, and it is just
   as invisible while it is empty. */
.actions:empty { display: none; }
.post:empty { display: none; }
.post .qstatus { margin-top: 28px; }
.post .actions { margin-top: 18px; }
/* Change spec v7 §C: the recorded answer locks on the same screen.  The chosen
   option keeps a stronger border and gains a check mark; the others recede
   without dropping below AA (no opacity, so the text stays legible). */
.opts label.is-locked { border-width: 2px; border-color: var(--accent); background: var(--accent-soft); cursor: default; }
.opts label.is-dim { background: var(--ground); border-color: var(--line); color: var(--ink-2); cursor: default; }
.opts label.is-dim:hover { border-color: var(--line); }
.opts .otick { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 19px; line-height: 1; }
/* Change spec v14 §C: the locked option says which way it went — border colour
   only, no fill change, and the tick in the same slot becomes ✓ or ✕.  The
   correct option is never highlighted when the learner was wrong; the feedback
   sentence carries the fact. */
.opts label.is-correct { border-color: var(--fixed); }
.opts label.is-wrong { border-color: var(--barrier); }
.opts label.is-correct .otick { color: var(--fixed); }
.opts label.is-wrong .otick { color: var(--barrier); }
/* Change spec v14 §C: the feedback line uses the practice completion line's
   pattern (v13 §E) — a 20 px circle, then the sentence in body text.  No box,
   no left rule, no fill behind the words. */
.qstatus:not(:empty) {
  margin-top: 14px; display: flex; align-items: flex-start; gap: 10px;
  font-size: 16px; color: var(--ink); max-width: 68ch;
}
.qmark {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; line-height: 1; font-weight: 700;
  /* the circle rides with the first line of the sentence */
  margin-top: 2px;
}
.qmark.is-correct { background: var(--fixed-soft); color: var(--fixed); }
.qmark.is-wrong { background: var(--barrier-soft); color: var(--barrier); }

/* --- Effort rating faces -------------------------------------------------- */
.rating { max-width: 560px; margin-top: 6px; border: 0; padding: 0; }
.faces { display: flex; flex-direction: column; gap: 10px; }
.face {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow); cursor: pointer; font-size: 17px; font-weight: 600;
}
.face:hover { border-color: var(--accent); }
.face.is-checked { border-color: var(--accent); background: var(--accent-soft); }
.face input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.face .emoji { font-size: 30px; line-height: 1; }

/* --- Crosswalk ------------------------------------------------------------ */
/* Change spec v16 §A: the try-again screen is gone, and with it both of the
   rules only that screen ever used — its measurement line and its `.notice`
   line of direction. */
.timeline-note { color: var(--ink-2); font-size: 16px; margin-top: 10px; }
.pair {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 26px; max-width: 68ch;
}
.pair .pair-label { font-weight: 700; }
.pair .emoji { font-size: 24px; line-height: 1; }
.pair .arrow { color: var(--ink-2); font-weight: 700; }
/* Change spec v10 §B.5: the arrow and the second face are one unit that never
   breaks; the pair wraps before the arrow if it has to. */
.pair .pairtail { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 10px; }
.pair .facepair { display: inline-flex; align-items: center; gap: 6px; }
/* The answer pair sits directly under the rating pair in the same card style. */
.pair.answers { margin-top: -18px; align-items: baseline; font-size: 16px; }
.sumrow .pair.answers { margin-top: -2px; }
.pair.answers .side { color: var(--ink); }
.pair.answers .side b { font-weight: 700; }
.pair.answers .side.none b { font-weight: 600; color: var(--ink-2); }

/* --- Crosswalk screen 1 · What changed (change spec v10 §G) --------------
   A Before block and an After block, each opening with a small tag and the
   learner's own reaction line, then the paragraph, then the artifact: frozen
   in the Before block, frozen with numbered pins and a notes column in the
   After block. */
.xblock { max-width: 1000px; margin-top: 22px; }
.xhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.xtag {
  flex: none; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 700; border-radius: 4px; padding: 3px 9px;
}
.is-before .xtag { background: var(--barrier-soft); color: var(--barrier); }
.is-after .xtag { background: var(--fixed-soft); color: var(--fixed); }
.xreact { color: var(--ink); font-weight: 600; }
.xreact .emoji { font-size: 21px; line-height: 1; vertical-align: -3px; }
.xpara { max-width: 68ch; color: var(--ink-2); margin-bottom: 18px; }
.xdiv { border-top: 1px solid var(--line); margin: 34px 0 0; max-width: 1000px; }

.pinwrap { position: relative; display: block; max-width: 760px; }
/* The pinned artifact keeps a gutter on its left so a numbered circle can sit
   beside the element it marks instead of on top of it. */
.pinned .pinwrap { padding-left: 26px; }
.frozen { display: block; }
.frozen.is-before { max-height: 420px; overflow-y: auto; border-radius: 8px; }
.pin {
  position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--paper); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; line-height: 1; z-index: 3;
  box-shadow: 0 0 0 2px var(--paper);
}
.pinned { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(210px, 1fr); gap: 30px; align-items: start; }
.pinnotes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.pinnotes li { display: flex; gap: 10px; align-items: flex-start; }
.pinnum {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--paper); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; line-height: 1; margin-top: 1px;
}
.pinnote { color: var(--ink-2); font-size: 16px; }

/* Frozen artifacts are pictures of the real mocks, so they are compacted, and
   they never scroll or animate under the After block, where pins sit on them. */
.frozen .sr-sim { font-size: 13px; }
.frozen .sr-sim .doc .chrome { min-height: 34px; padding: 6px 10px; }
.frozen .sr-sim .doc .body { height: auto; padding: 16px 18px; }
.frozen .mock-email { font-size: 13px; }
.frozen .mock-email img { max-width: 170px; }
.frozen .mock-email .em-details .d-h { font-size: 15px; }
.frozen .mock-browser .bviewport { max-height: none; min-height: 0; overflow: visible; }
.frozen .mock-word { font-size: 12px; }
.frozen .mock-word .w-split { grid-template-columns: 208px 1fr; }
.frozen .mock-word .w-pane, .frozen .mock-word .w-pages { max-height: none; overflow: visible; }
.frozen .mock-word .w-pages { padding: 12px; }
.frozen .mock-word .w-page { padding: 20px 24px 10px; font-size: 12.5px; max-width: 460px; }
.frozen .mock-word .w-paneitem { font-size: 11.5px; padding: 3px 6px; line-height: 1.3; }
.frozen .mock-word .w-doctitle { font-size: 20px; }
.frozen .mock-video { max-width: 460px; }
.frozen .vstage .pres-body { animation: none; }
.frozen .vcc { font-size: 13px; bottom: 10px; }
.frozen .vtranscript p { font-size: 13px; }
.frozen .vform { padding: 18px 18px 22px; }
.frozen .vform h2 { font-size: 19px; }
.frozen .vform .f-row { margin-bottom: 12px; }
.frozen .vew .v-hero { padding: 24px 22px 12px; }
.frozen .vew .v-ctawrap { padding-bottom: 24px; }
.frozen .vew .v-learnwrap { padding-bottom: 24px; }
/* Practice 1 keeps its screen on the whole time, so the frame is sized to the
   notice rather than to the taller dark state it never enters. */
#screen-lab-p1 .sr-sim { --doc-h: 300px; }

/* --- Crosswalk screen 2 · Your role --------------------------------------- */
.rolebody p { color: var(--ink-2); }
.rolebody p.first { color: var(--ink); font-size: 19px; }
.wherelse { max-width: 900px; margin-top: 30px; }
.wherelse ul {
  margin: 10px 0 0; padding-left: 22px; color: var(--ink-2);
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 6px 26px;
}
.wherelse li::marker { color: var(--fixed); }

/* --- Closing -------------------------------------------------------------- */
.exitbeat { margin-bottom: 30px; }
.exitbeat p.first { color: var(--ink); font-size: 19px; }
.sumrow .measurebox {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 10px; max-width: 68ch;
}
.sumrow .measure { color: var(--ink-2); font-size: 16px; }
.sumrow .measure + .measure { margin-top: 3px; }
/* The library practice page is short; it does not need the task-sized viewport. */
#screen-lab-p2 .mock-browser .bviewport { min-height: 0; }
.restart-confirm {
  margin-top: 18px; max-width: 460px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; box-shadow: var(--shadow);
}
.restart-confirm .restart-q { font-weight: 600; margin-bottom: 12px; }
.restart-confirm .restart-q:focus { outline: none; }
.restart-confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sumrow {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 12px; max-width: 68ch;
}
.sumrow h2 { font-size: 19px; margin: 0 0 10px; }
.sumrow .pair { margin-bottom: 10px; box-shadow: none; }
.sumrow p { color: var(--ink-2); font-size: 16px; }
blockquote.pull {
  margin: 34px 0 0; padding: 20px 0 20px 22px; border-left: 4px solid var(--accent);
  max-width: 60ch; font-family: var(--display); font-size: clamp(20px, 3vw, 25px);
  font-weight: 500; line-height: 1.3;
}

/* --- Footer --------------------------------------------------------------- */
.app-foot { border-top: 1px solid var(--line); background: var(--paper); }
.app-foot p { max-width: 1180px; margin: 0 auto; padding: 18px 20px; font-size: 14px; color: var(--ink-2); }

/* --- Screen transitions (System B idiom; System B itself swaps instantly) -- */
@keyframes screen-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.screen.entering { animation: screen-rise .28s ease both; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; animation-iteration-count: 1 !important; }
}

/* --- Responsive ----------------------------------------------------------- */
@media (max-width: 860px) {
  /* The notes column stacks under the pinned artifact. */
  .pinned { grid-template-columns: 1fr; gap: 20px; }
}
@media (max-width: 720px) {
  .screen { padding: 22px 14px 60px; }
  .rail-in { padding: 8px 14px; gap: 12px; }
  .wordmark { font-size: 15px; }
  /* Change spec v14 §A: the v13 rule that visually hid every step but the
     current one below 720 px is gone.  The bar takes its own full-width row
     under the wordmark and wraps onto as many lines as it needs; every item
     is on screen at every width. */
  .progress { order: 3; flex-basis: 100%; min-width: 0; }
  .steps-list { gap: 16px; row-gap: 4px; }
  /* Two columns do not fit at phone width; the control sits above what it does. */
  .controls { max-width: 100%; }
  .controls dl { display: flex; flex-direction: column; gap: 11px; }
  .controls .crow { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .frozen .mock-word .w-split { grid-template-columns: 1fr; }
  .frozen .mock-word .w-page { max-width: 100%; }
}


/* ==========================================================================
   PART 2 — THE MOCKED ARTIFACTS.
   These are supposed to look like real products, not like the tool above.
   They use their own literal colors and font stacks (Office / Segoe / Arial /
   the Conference B navy-and-gold brand), never the System B tokens, exactly
   as design-system.md §5.5 describes ("the inside-the-fake-artifact palette is
   intentionally NOT themed to match the app shell").
   ========================================================================== */

/* Additive overrides for the inlined sr-simulator component.  Additions in the
   host page, not edits to sr-simulator.css.  With the component's own chrome
   removed (change spec §A) it is a bare stacked artifact, so it paints no
   ground of its own and takes no page padding. */
.sr-sim { background: transparent; }
.sr-sim :focus-visible { box-shadow: 0 0 0 2px var(--ink); }
/* The component's own <main> wrapper is swapped for this plain container in
   the host, so the page keeps exactly one main landmark.  Same box. */
.sr-sim .sim-main { width: 100%; max-width: 1000px; margin: 0; padding: 0; }
.sr-sim .doc .chrome { color: var(--ink-2); }          /* AA: --ink-3 was 3.6:1 here */
/* The pre-reveal practice frame (change spec §A.5) is the same document frame
   rendered sighted, and change spec v7 §G pins it to the same --doc-h as the
   dark state, so nothing moves at the reveal. */
.mock-word .w-pages:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; box-shadow: inset 0 0 0 2px #1a1a1a; }

/* --- Email client mock ---------------------------------------------------- */
.mock-email {
  background: #FFFFFF; color: #1A1A1A;
  font-family: "Segoe UI", Calibri, Arial, sans-serif; font-size: 15px; line-height: 1.5;
}
.mock-email .em-head {
  font-size: 13px; color: #444; border-bottom: 1px solid #E1E1E1;
  padding-bottom: 10px; margin-bottom: 14px;
}
.mock-email .em-head div { padding: 1px 0; }
.mock-email .em-head b { color: #666; display: inline-block; width: 5.5em; font-weight: 600; }
.mock-email .em-sub { font-size: 18px; font-weight: 600; color: #1A1A1A; margin-bottom: 10px; }
.mock-email p { margin: 0 0 12px; }
.mock-email img { display: block; max-width: 340px; width: 100%; height: auto; border: 1px solid #E1E1E1; }
.mock-email .em-details { margin: 0 0 14px; }
.mock-email .em-details .d-h { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
.mock-email .em-details p { margin: 0 0 4px; }
.mock-email a { color: #0563C1; }
.doc-plain { font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #1A1A1A; font-size: 15px; }
.doc-plain p { margin: 0 0 10px; }
.doc-plain a { color: #0563C1; }

/* --- Browser-chrome window mock ------------------------------------------ */
.mock-browser {
  border: 1px solid #C9CDD2; border-radius: 8px; overflow: hidden;
  background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.08);
  max-width: 1000px;
}
.mock-browser .bchrome {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: #E8EAED; border-bottom: 1px solid #C9CDD2;
}
.mock-browser .bdots { display: flex; gap: 5px; }
.mock-browser .bdots i { width: 10px; height: 10px; border-radius: 50%; background: #BFC4CA; display: block; }
.mock-browser .urlbar {
  flex: 1; background: #FFFFFF; border: 1px solid #C9CDD2; border-radius: 999px;
  padding: 5px 14px; font-size: 13px; color: #3C4043;
  font-family: "Segoe UI", Arial, sans-serif; min-width: 0;
}
.mock-browser .bviewport { max-height: 62vh; min-height: 380px; overflow-y: auto; background: #FFFFFF; }
.mock-browser.fit .bviewport { max-height: none; min-height: 0; overflow: visible; }
/* The compact homepage the crosswalk freezes: the same page without the three
   body sections, so the nav, the headline, Registration and the footer all sit
   in one view. */
.mock-browser.compact .bviewport { max-height: none; min-height: 0; overflow: visible; }
.mock-browser.compact .urlbar { font-size: 12px; }

/* --- Conference B brand (Virtual Education Workshops), Michelle's palette -- */
.vew {
  --b-brand: #1b2a52; --b-gold: #c9a227; --b-tint: #eef1f8;
  font-family: "Segoe UI", Arial, Helvetica, sans-serif; color: #22262e; font-size: 15px; line-height: 1.55;
}
.vew a { color: #1b2a52; }
.vew .v-top { background: var(--b-brand); color: #FFFFFF; padding: 14px 22px; }
.vew .v-mark { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.vew .v-mark i { font-style: italic; }
.vew .v-nav { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.vew .v-nav a { color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; }
.vew .v-nav a:hover { border-bottom-color: var(--b-gold); }
/* Change spec §F: the homepage is laid out by named grid areas, so the first
   version can order its DOM any way it likes — footer before content,
   Registration last — without moving one pixel on screen.  The visual layout
   of the two versions is identical; only the code order differs. */
.vew.v-home {
  display: grid; grid-template-columns: max-content 1fr;
  grid-template-areas: "top top" "htext htext" "cta learn" "body body" "foot foot";
}
.vew.v-home > .v-top { grid-area: top; }
.vew.v-home > .v-hero { grid-area: htext; }
.vew.v-home > .v-ctawrap { grid-area: cta; }
.vew.v-home > .v-learnwrap { grid-area: learn; }
.vew.v-home > .v-body { grid-area: body; }
.vew.v-home > .v-foot { grid-area: foot; }
.vew .v-hero { background: var(--b-tint); padding: 34px 22px 16px; }
.vew .v-ctawrap { background: var(--b-tint); padding: 0 0 34px 22px; }
.vew .v-learnwrap { background: var(--b-tint); padding: 0 22px 34px 0; display: flex; align-items: center; }
.vew .v-hero h2 { font-family: inherit; font-size: 30px; font-weight: 700; color: var(--b-brand); margin: 0 0 10px; line-height: 1.15; }
.vew .v-hero p { margin: 0; max-width: 52ch; color: #333a45; }
.vew .v-cta {
  display: inline-block; background: var(--b-gold); color: #241d00;
  font-weight: 700; font-size: 16px; padding: 12px 26px; border-radius: 4px;
  text-decoration: none; border: 0; margin-right: 14px;
}
.vew .v-cta:hover { filter: brightness(1.06); }
.vew .v-learn { font-weight: 600; color: var(--b-brand); }
.vew .v-body { padding: 26px 22px; }
.vew .v-body h3 { font-family: inherit; font-size: 19px; font-weight: 700; color: var(--b-brand); margin: 0 0 6px; }
.vew .v-sec + .v-sec { margin-top: 24px; padding-top: 22px; border-top: 1px solid #E2E5EC; }
.vew .v-sponsors { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; }
.vew .v-sponsors a { font-weight: 600; }
.vew .v-foot { background: #F4F6FA; border-top: 1px solid #E2E5EC; padding: 16px 22px; font-size: 14px; color: #4a5160; }
.vew .v-footnav { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
.vew .v-footnav a { font-weight: 600; }
.vew .v-regpage { padding: 40px 22px; }
.vew .v-regpage h2 { font-family: inherit; font-size: 26px; color: var(--b-brand); margin: 0 0 10px; }

/* --- Small neutral practice page (Task 2 practice) ----------------------- */
.mock-lib { font-family: "Segoe UI", Arial, sans-serif; color: #22262e; padding: 24px 22px; }
.mock-lib h2 { font-family: inherit; font-size: 22px; margin: 0 0 6px; color: #1f3b2f; }
.mock-lib p { margin: 0 0 16px; color: #47504b; }
.mock-lib nav { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.mock-lib nav a { color: #14515E; font-weight: 600; }
.mock-lib .lib-search { border: 1px solid #9aa3a0; background: #FFFFFF; color: #22262e; border-radius: 4px; padding: 6px 14px; font-weight: 600; }
.mock-lib .lib-out { margin-top: 18px; font-weight: 600; color: #1f3b2f; }

/* --- Registration form mock ---------------------------------------------- */
.vform { padding: 26px 22px 30px; max-width: 620px; font-family: "Segoe UI", Arial, sans-serif; color: #22262e; }
.vform h2 { font-family: inherit; font-size: 22px; color: #1b2a52; margin: 0 0 4px; }
.vform .f-intro { font-size: 14px; color: #4a5160; margin-bottom: 20px; }
.vform .f-row { margin-bottom: 16px; }
.vform input[type="text"], .vform input[type="email"] {
  width: 100%; padding: 9px 11px; border: 1px solid #8d949c; border-radius: 3px;
  background: #FFFFFF; color: #1A1A1A; font-size: 15px;
}
.vform .f-check { display: flex; gap: 10px; align-items: flex-start; margin: 20px 0; }
.vform .f-check input { width: 17px; height: 17px; margin-top: 3px; flex: none; accent-color: #1b2a52; }
.vform .f-submit { background: #1b2a52; color: #FFFFFF; border: 0; border-radius: 4px; padding: 11px 26px; font-weight: 700; font-size: 16px; }
.vform .f-status { margin-top: 14px; font-size: 14px; color: #4a5160; min-height: 1.4em; }
/* Broken version only — the deliberate barriers (change spec v10 §F).  There
   is no helper text and no symbol here: required status is a coloured left
   border and nothing else, and every field's only label is its placeholder. */
.vform.is-broken .is-reqcolor { border-left: 4px solid #C2402F; }
.vform.is-broken .f-agree { font-size: 14px; color: #22262e; }
.vform.is-broken span.f-agree.is-reqcolor { padding-left: 8px; border-left-width: 4px; border-left-style: solid; }
/* Repaired version */
.vform.is-fixed label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; color: #22262e; }
.vform.is-fixed .f-help { color: #4a5160; font-size: 14px; margin: 4px 0 6px; }
.vform.is-fixed .f-help.above { margin: 0 0 6px; }
.vform.is-fixed .f-agree { font-size: 15px; color: #22262e; }

/* --- Word for Windows document window (change spec §G) --------------------
   A Microsoft 365-style window: title bar, ribbon tab strip with View active,
   the View tab's "Show" group, and a Navigation pane that docks on the left.
   Text labels only — no Microsoft logo and no Office icon glyphs.
   --------------------------------------------------------------------------*/
.mock-word {
  border: 1px solid #C9CDD2; border-radius: 8px; overflow: hidden; background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.08);
  font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #1a1a1a; max-width: 1000px;
}
.mock-word .w-title {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: #F3F2F1; border-bottom: 1px solid #E1DFDD; padding: 7px 12px;
  font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #323130;
}
.mock-word .w-file { font-weight: 600; }
.mock-word .w-ribbon {
  display: flex; gap: 2px; flex-wrap: wrap; align-items: center;
  background: #F3F2F1; border-bottom: 1px solid #E1DFDD; padding: 0 10px;
  font-family: "Segoe UI", Arial, sans-serif;
}
.mock-word .w-rtab {
  border: 0; background: transparent; color: #3B3A39; font-size: 13px; font-weight: 600;
  padding: 8px 12px; border-bottom: 2px solid transparent; border-radius: 3px 3px 0 0;
}
.mock-word .w-rtab[aria-disabled="true"] { color: #605E5C; cursor: default; }
.mock-word .w-rtab.is-active { color: #185ABD; border-bottom-color: #185ABD; background: #FFFFFF; }
.mock-word .w-ribbonbody {
  background: #FFFFFF; border-bottom: 1px solid #D8D6D4; padding: 8px 12px 6px;
  font-family: "Segoe UI", Arial, sans-serif;
}
.mock-word .w-group {
  border: 0; border-right: 1px solid #E1DFDD; margin: 0; padding: 0 18px 0 0;
  display: inline-flex; flex-direction: column; gap: 3px;
}
.mock-word .w-group legend { font-size: 11px; color: #605E5C; padding: 0; float: none; }
.mock-word .w-group label {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #201F1E;
  padding: 2px 4px; cursor: pointer;
}
.mock-word .w-group input { width: 14px; height: 14px; margin: 0; flex: none; accent-color: #185ABD; }
.mock-word .w-split { display: grid; grid-template-columns: 262px 1fr; }
.mock-word .w-split.pane-closed { grid-template-columns: 1fr; }
.mock-word .w-pane {
  background: #F3F2F1; border-right: 1px solid #D8D6D4; padding: 10px 8px 12px;
  font-family: "Segoe UI", Arial, sans-serif; font-size: 13px;
  max-height: 62vh; overflow-y: auto;
}
.mock-word .w-panehead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mock-word .w-panetitle { font-size: 15px; font-weight: 600; color: #201F1E; margin: 0; }
.mock-word .w-paneclose {
  margin-left: auto; border: 0; background: transparent; color: #3B3A39;
  font-size: 15px; line-height: 1; padding: 4px 8px; border-radius: 3px;
}
.mock-word .w-paneclose:hover { background: #E1DFDD; }
.mock-word .w-panesearch {
  width: 100%; border: 1px solid #8A8886; border-radius: 2px; background: #FFFFFF;
  color: #3B3A39; font-size: 13px; padding: 5px 8px; margin-bottom: 8px;
  font-family: inherit;
}
.mock-word .w-panetabs { display: flex; gap: 2px; border-bottom: 1px solid #D8D6D4; margin-bottom: 8px; }
.mock-word .w-panetabs button {
  border: 0; background: transparent; color: #3B3A39; font-size: 12.5px; font-weight: 600;
  padding: 6px 10px; border-bottom: 2px solid transparent;
}
.mock-word .w-panetabs button[aria-pressed="true"] { color: #185ABD; border-bottom-color: #185ABD; }
.mock-word .w-panetabs button[aria-disabled="true"] { color: #605E5C; cursor: default; }
.mock-word .w-pane ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.mock-word .w-pane li ul { padding-left: 15px; margin-top: 1px; }
.mock-word .w-panerow { display: flex; align-items: flex-start; gap: 2px; }
.mock-word .w-twisty {
  flex: none; width: 18px; border: 0; background: transparent; color: #3B3A39;
  font-size: 10px; line-height: 1.6; padding: 4px 0; border-radius: 3px;
}
.mock-word .w-twisty:hover { background: #E1DFDD; }
.mock-word .w-twisty-sp { flex: none; width: 18px; display: inline-block; }
.mock-word .w-paneitem {
  display: block; flex: 1; text-align: left; border: 0; background: transparent;
  color: #201F1E; padding: 4px 8px; border-radius: 3px; font-size: 13px; line-height: 1.35;
  font-family: inherit;
}
.mock-word .w-paneitem:hover { background: #E1DFDD; }
.mock-word .w-paneitem[aria-current="true"] { background: #DEECF9; font-weight: 700; }
.mock-word .w-pages {
  background: #E6E4E2; padding: 16px; max-height: 62vh; overflow-y: auto; position: relative;
}
.mock-word .w-page {
  background: #FFFFFF; border: 1px solid #D8D6D4; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  padding: 34px 40px 14px; margin: 0 auto 16px; max-width: 660px; font-size: 14.5px; line-height: 1.5;
}
.mock-word .w-page p { margin: 0 0 9px; }
.mock-word .w-page ul { margin: 0 0 9px; padding-left: 22px; }
.mock-word .w-page li { margin-bottom: 3px; }
.mock-word .w-foot { border-top: 1px solid #E5E5E5; margin-top: 14px; padding-top: 6px; font-size: 12px; color: #666; text-align: center; }
.mock-word .w-doctitle { text-align: center; font-size: 26px; font-weight: 700; margin: 0 0 4px; font-family: Calibri, Arial, sans-serif; }
.mock-word .w-docsub { text-align: center; font-size: 13.5px; color: #555; margin-bottom: 20px; }
.mock-word .w-sess { margin: 0 0 12px; }
.mock-word .w-time { font-size: 13.5px; color: #444; margin: 0 0 4px; }
.mock-word .w-page [tabindex="-1"]:focus { outline: 2px solid #2F5496; outline-offset: 3px; box-shadow: none; }
.mock-word .w-hit { background: #FFF4CE; box-shadow: 0 0 0 6px #FFF4CE; }
/* Broken: every title is manual formatting, and no two agree.  mh-small is
   deliberately smaller than the session titles beneath it (change spec §H). */
.mock-word .mh { font-weight: 700; color: #1a1a1a; font-family: Calibri, Arial, sans-serif; }
.mock-word .mh-big { font-size: 21px; text-align: center; margin: 18px 0 10px; }
.mock-word .mh-bold { font-size: 15px; margin: 14px 0 3px; }
.mock-word .mh-center { font-size: 17px; text-align: center; margin: 22px 0 12px; }
.mock-word .mh-under { font-size: 16px; text-decoration: underline; margin: 10px 0 8px; }
.mock-word .mh-spaced { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 26px 0 4px; }
.mock-word .mh-small { font-size: 13px; margin: 20px 0 2px; font-weight: 600; }
/* Repaired: Word's built-in Heading 1 / Heading 2 styles, consistently applied. */
.mock-word .rh1, .mock-word .rh2 { font-family: "Calibri Light", Calibri, Arial, sans-serif; color: #2F5496; font-weight: 400; }
.mock-word .rh1 { font-size: 21px; margin: 20px 0 8px; }
.mock-word .rh2 { font-size: 17px; color: #2F5496; margin: 16px 0 5px; }
.mock-word .w-page > .rh1:first-child, .mock-word .w-page > .mh:first-child { margin-top: 0; }

/* --- Video player mock ---------------------------------------------------- */
.mock-video { max-width: 720px; }
.vstage {
  position: relative; background: #10141a; aspect-ratio: 16 / 9;
  border-radius: 8px 8px 0 0; overflow: hidden;
}
.vstage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
@keyframes idle-sway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
.vstage .pres-body { animation: idle-sway 3.4s ease-in-out infinite; transform-origin: center bottom; }
.vstage.is-playing .pres-body { animation-duration: 2.2s; }
@media (prefers-reduced-motion: reduce) { .vstage .pres-body { animation: none; } }
.vchip {
  position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,.72); color: #FFD9CF;
  font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 3px;
}
.vcc {
  position: absolute; left: 16px; right: 16px; bottom: 14px; text-align: center;
  font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.45; pointer-events: none;
}
.vcc span { background: rgba(0,0,0,.92); color: #FFFFFF; padding: 3px 9px; display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.vctrl {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: #1b2027; color: #E6EAEE; padding: 10px 12px; border-radius: 0 0 8px 8px;
  font-family: var(--mono); font-size: 12px;
}
.vctrl button {
  border: 1px solid #6E7A87; background: #2A313A; color: #FFFFFF;
  border-radius: 4px; padding: 7px 14px; font-family: var(--body); font-size: 15px; font-weight: 600;
}
.vctrl button:hover { background: #384049; }
.vctrl .vbar { flex: 1; min-width: 90px; height: 6px; background: #444C55; border-radius: 3px; overflow: hidden; }
.vctrl .vbar i { display: block; height: 100%; width: 0; background: #8FD9C1; }
.vctrl .vtime { font-variant-numeric: tabular-nums; color: #E6EAEE; }
.vtranscript {
  margin-top: 14px; background: #FFFFFF; border: 1px solid #C9CDD2; border-radius: 6px;
  padding: 12px 16px; max-width: 720px; color: #1A1A1A; font-family: "Segoe UI", Arial, sans-serif;
}
.vtranscript summary { font-weight: 700; cursor: pointer; font-size: 16px; }
.vtranscript p { margin: 12px 0 0; font-size: 15px; line-height: 1.6; }
.vnote { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

@media (max-width: 720px) {
  .mock-word .w-split { grid-template-columns: 1fr; }
  .mock-word .w-pane { border-right: 0; border-bottom: 1px solid #D8D6D4; max-height: 200px; }
  .mock-word .w-page { padding: 22px 20px 12px; }
  .vew .v-hero h2 { font-size: 24px; }
}
</style>
