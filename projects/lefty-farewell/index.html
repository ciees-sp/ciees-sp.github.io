<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's Not Me, It's Your Cartilage 🦵💔</title>
<style>
  :root{
    --bg1:#ff9a9e; --bg2:#a18cd1; --bg3:#84fab0;
    --me:#0a84ff; --me2:#0066ff;
    --them:#e9e9eb; --them-text:#000;
    --titanium1:#b0b8c4; --titanium2:#6e7b8c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:28px 14px 40px;
    background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),#ffd1ff);
    background-size:400% 400%;
    animation:gradient 16s ease infinite;
    overflow-x:hidden;
  }
  @keyframes gradient{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .title{
    text-align:center;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.25);
    font-weight:800;letter-spacing:.2px;
  }
  .title h1{margin:0;font-size:22px;}
  .title p{margin:4px 0 0;font-size:13px;font-weight:600;opacity:.92;}

  /* Phone */
  .phone{
    position:relative;width:380px;max-width:94vw;height:760px;max-height:82vh;
    background:#000;border-radius:46px;padding:12px;
    box-shadow:0 30px 70px rgba(0,0,0,.45), inset 0 0 0 2px #1c1c1e;
  }
  .screen{
    position:relative;width:100%;height:100%;background:#fff;border-radius:36px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:150px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:30;
  }

  /* Header */
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 22px 2px;font-size:13px;font-weight:600;color:#000;z-index:20;
  }
  .statusbar .right{display:flex;gap:6px;align-items:center;}
  .chat-header{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0 10px;border-bottom:.5px solid #d9d9de;
    background:rgba(248,248,250,.92);backdrop-filter:blur(8px);z-index:15;
  }
  .avatar{
    width:50px;height:50px;border-radius:50%;
    background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .chat-header .name{font-size:13px;font-weight:600;color:#000;display:flex;align-items:center;gap:5px;}
  .chat-header .chevron{position:absolute;left:18px;top:46px;color:var(--me);font-size:24px;font-weight:700;}
  .chat-header .meta{position:absolute;right:18px;top:48px;color:var(--me);font-size:20px;display:flex;gap:14px;}

  /* Messages */
  .messages{
    flex:1;overflow-y:auto;padding:14px 14px 22px;
    display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;
    background:#fff;
  }
  .messages::-webkit-scrollbar{width:0;}
  .row{display:flex;width:100%;margin-top:7px;}
  .row.me{justify-content:flex-end;}
  .row.them{justify-content:flex-start;}
  .row.titanium{justify-content:flex-start;}

  .bubble{
    position:relative;max-width:74%;padding:9px 14px;font-size:15.5px;line-height:1.32;
    border-radius:20px;animation:pop .34s cubic-bezier(.2,.9,.3,1.3);
    word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06);
  }
  .me .bubble{
    background:linear-gradient(180deg,var(--me),var(--me2));color:#fff;
    border-radius:20px 20px 6px 20px;
  }
  .them .bubble{
    background:var(--them);color:var(--them-text);
    border-radius:20px 20px 20px 6px;
  }
  .titanium .bubble{
    background:linear-gradient(180deg,var(--titanium1),var(--titanium2));color:#fff;
    border-radius:20px 20px 20px 6px;font-weight:600;
    box-shadow:0 2px 10px rgba(110,123,140,.5);
  }
  @keyframes pop{
    0%{opacity:0;transform:translateY(14px) scale(.6);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }

  /* tapback reaction */
  .bubble .tapback{
    position:absolute;top:-14px;left:-12px;background:#fff;border-radius:50%;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.25);
    animation:pop .3s cubic-bezier(.2,.9,.3,1.3);
  }
  .me .bubble .tapback{left:auto;right:-12px;}

  .receipt{
    align-self:flex-end;font-size:11px;color:#8e8e93;font-weight:600;
    margin:2px 4px 4px 0;animation:pop .3s ease;
  }

  .system{
    align-self:center;text-align:center;font-size:12.5px;color:#8a8a8e;font-weight:600;
    margin:14px 8px;animation:fadeIn .5s ease;max-width:88%;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* typing indicator */
  .typing{display:flex;gap:4px;align-items:center;padding:12px 16px;}
  .typing span{width:8px;height:8px;background:#9a9aa0;border-radius:50%;animation:blink 1.3s infinite;}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* tombstone finale */
  .tombstone{
    align-self:center;width:286px;max-width:92%;margin:24px auto 6px;
    background:linear-gradient(180deg,#d2d7dc 0%,#aab1b8 60%,#959ca3 100%);
    border:2px solid #b9c0c6;border-radius:150px 150px 16px 16px;
    padding:30px 22px 22px;text-align:center;color:#373c41;
    font-family:Georgia,'Times New Roman',serif;
    box-shadow:0 16px 34px rgba(0,0,0,.32), inset 0 3px 8px rgba(255,255,255,.55), inset 0 -10px 18px rgba(0,0,0,.12);
    animation:rise 1s cubic-bezier(.2,.85,.25,1.04);
  }
  @keyframes rise{0%{opacity:0;transform:translateY(70px) scale(.88);}60%{opacity:1;}100%{opacity:1;transform:translateY(0) scale(1);}}
  .tombstone .rip{font-size:24px;font-weight:700;letter-spacing:6px;}
  .tombstone .name{font-size:32px;font-weight:800;letter-spacing:4px;margin:0 0 2px;}
  .tombstone .run{font-size:13px;font-style:italic;color:#5a6066;letter-spacing:1px;}
  .tombstone hr{border:none;border-top:1.5px solid #7d848b;width:62%;margin:12px auto;}
  .tombstone .epitaph{font-size:14px;line-height:1.5;font-style:italic;}
  .tombstone .epitaph b{font-style:normal;}
  .tombstone .flowers{font-size:22px;margin-top:14px;}
  .sendoff{
    align-self:center;text-align:center;margin:4px 8px 8px;max-width:88%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;font-weight:700;color:#5a6066;animation:fadeIn .6s ease;
  }

  /* controls */
  .controls{display:flex;gap:10px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;color:#fff;cursor:pointer;
    border:none;border-radius:999px;padding:11px 22px;
    background:rgba(255,255,255,.22);backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.6);transition:transform .15s,background .15s;
  }
  button:hover{background:rgba(255,255,255,.34);transform:translateY(-1px);}
  button:active{transform:translateY(1px);}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .confetti-piece{position:absolute;top:-20px;width:10px;height:14px;opacity:.95;will-change:transform;}
</style>
</head>
<body>
  <div class="title">
    <h1>📱 Last text to a fallen joint</h1>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="statusbar">
        <span>6:58</span>
        <span class="right">📶 &nbsp;🔋</span>
      </div>
      <div class="chat-header">
        <span class="chevron">‹</span>
        <div class="avatar">🦵</div>
        <span class="name">Left Knee <span style="opacity:.5">›</span></span>
        <span class="meta">📹 ⓘ</span>
      </div>
      <div class="messages" id="messages"></div>
    </div>
  </div>

  <div class="controls">
    <button id="replay">↺ Replay</button>
    <button id="skip">⏭ Skip to end</button>
  </div>

  <div id="confetti"></div>

<script>
const messagesEl = document.getElementById('messages');
const confettiEl = document.getElementById('confetti');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// from: me | them | titanium | system | receipt | finale
const script = [
  {from:'me',    text:"Hey. We need to talk. 💙"},
  {from:'them',  text:'oh no. a "we need to talk" text'},
  {from:'them',  text:'are you breaking up with me'},
  {from:'me',    text:"Five decades is a good run, Lefty."},
  {from:'me',    text:"But let's be honest — you've been trouble since college. 🙃"},
  {from:'me',    text:"It's time I start seeing other joints."},
  {from:'them',  text:'is this about the stairs'},
  {from:'them',  text:'i TOLD you i was working on the stairs 😤'},
  {from:'me',    text:"It's not me. It's you. Specifically your cartilage."},
  {from:'them',  text:'i can change!! 🥺'},
  {from:'me',    text:"You medically cannot. I was a PHYSICAL THERAPIST, babe."},
  {from:'me',    text:"I rehabbed knees for a living. I know EXACTLY what you're up to."},
  {from:'them',  text:'…but you FIX knees 🥺'},
  {from:'me',    text:"Used to. Now I retire them."},
  {from:'them',  text:'what about the gardening. the walks with Charlie. all those years on the clinic floor'},
  {from:'me',    text:"I'll always treasure the grinding noises. 😢", react:'❤️'},
  {from:'them',  text:'…who is he'},
  {from:'me',    text:"His name is Titanium."},
  {from:'them',  text:'TITANIUM???'},
  {from:'them',  text:"he doesn't even HAVE nerve endings"},
  {from:'me',    text:"Exactly. Zero pain. That's kind of the whole point. 😅"},
  {from:'me',    text:"Tomorrow. Be ready. 🏥"},
  {from:'receipt', text:'Read'},
  {from:'system', text:'🦵 Left Knee left the conversation.'},
  {from:'system', text:'🦿 Titanium Knee was added to the conversation.'},
  {from:'titanium', text:"sup 💪 Charlie's leash is by the door whenever you're ready 🐕"},
  {from:'tombstone'},
  {from:'sendoff', text:"💐 The Titanium Era begins tomorrow. Good luck, Michelle! 🎉🦿"},
];

let running = false, cancel = false;

function scrollDown(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function addBubble(item){
  const row = document.createElement('div');
  row.className = 'row ' + item.from;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = item.text;
  if(item.react){
    const t = document.createElement('div');
    t.className = 'tapback';
    t.textContent = item.react;
    b.appendChild(t);
  }
  row.appendChild(b);
  messagesEl.appendChild(row);
  scrollDown();
}

function addSystem(item){
  const d = document.createElement('div');
  d.className = 'system';
  d.innerHTML = item.text;
  messagesEl.appendChild(d);
  scrollDown();
}

function addReceipt(item){
  const d = document.createElement('div');
  d.className = 'receipt';
  d.textContent = item.text;
  messagesEl.appendChild(d);
  scrollDown();
}

function addTombstone(){
  const d = document.createElement('div');
  d.className = 'tombstone';
  d.innerHTML =
    '<div class="rip">R.I.P.</div>' +
    '<div class="name">LEFTY</div>' +
    '<div class="run">~ a good run ~</div>' +
    '<hr>' +
    '<div class="epitaph">She bent. She buckled. She popped audibly in quiet rooms.<br><br>' +
    'Survived by her loving sister, the <b>Right Knee</b> — now absolutely terrified.</div>' +
    '<div class="flowers">💐 🌷 💐</div>';
  messagesEl.appendChild(d);
  scrollDown();
}
function addSendoff(item){
  const d = document.createElement('div');
  d.className = 'sendoff';
  d.innerHTML = item.text;
  messagesEl.appendChild(d);
  scrollDown();
}

async function showTyping(who){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  row.id = 'typing-row';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(b);
  messagesEl.appendChild(row);
  scrollDown();
}
function removeTyping(){
  const t = document.getElementById('typing-row');
  if(t) t.remove();
}

async function run(){
  if(running) return;
  running = true; cancel = false;
  messagesEl.innerHTML = '';
  for(const item of script){
    if(cancel) break;
    if(item.from === 'them' || item.from === 'titanium'){
      await showTyping(item.from);
      await sleep(Math.min(1500, 650 + item.text.length * 22));
      if(cancel) break;
      removeTyping();
      addBubble(item);
    } else if(item.from === 'me'){
      await sleep(720);
      if(cancel) break;
      addBubble(item);
    } else if(item.from === 'receipt'){
      await sleep(450);
      addReceipt(item);
    } else if(item.from === 'system'){
      await sleep(item.text.includes('left') ? 1100 : 700);
      addSystem(item);
    } else if(item.from === 'tombstone'){
      await sleep(1000);
      addTombstone();
      fireConfetti();
    } else if(item.from === 'sendoff'){
      await sleep(900);
      addSendoff(item);
    }
    await sleep(260);
  }
  running = false;
}

function renderAll(){
  cancel = true;
  setTimeout(()=>{
    running = false;
    messagesEl.innerHTML = '';
    for(const item of script){
      if(item.from === 'system') addSystem(item);
      else if(item.from === 'receipt') addReceipt(item);
      else if(item.from === 'tombstone') addTombstone();
      else if(item.from === 'sendoff') addSendoff(item);
      else addBubble(item);
    }
    scrollDown();
    fireConfetti();
  }, 60);
}

/* ---- confetti ---- */
function fireConfetti(){
  const colors = ['#ff6a88','#ffd166','#06d6a0','#0a84ff','#c77dff','#ff99ac','#b0b8c4'];
  const emojis = ['🎉','🦿','💪','✨','🦵','💙'];
  for(let i=0;i<90;i++){
    const p = document.createElement('div');
    const useEmoji = Math.random() < 0.28;
    p.className = 'confetti-piece';
    const left = Math.random()*100;
    const delay = Math.random()*0.5;
    const dur = 2.6 + Math.random()*2.2;
    const drift = (Math.random()*2-1) * 160;
    const rot = (Math.random()*720-360);
    p.style.left = left + 'vw';
    if(useEmoji){
      p.style.fontSize = (16+Math.random()*16)+'px';
      p.style.width='auto'; p.style.height='auto';
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    } else {
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.borderRadius = Math.random()<.5 ? '2px' : '50%';
    }
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${drift}px, 105vh) rotate(${rot}deg)`, opacity:1, offset:.9},
      {transform:`translate(${drift}px, 110vh) rotate(${rot}deg)`, opacity:0}
    ], {duration:dur*1000, delay:delay*1000, easing:'cubic-bezier(.3,.6,.4,1)', fill:'forwards'});
    confettiEl.appendChild(p);
    setTimeout(()=>p.remove(), (dur+delay)*1000+200);
  }
}

document.getElementById('replay').addEventListener('click', ()=>{ cancel=true; setTimeout(run, 120); });
document.getElementById('skip').addEventListener('click', renderAll);

run();
</script>
</body>
</html>
